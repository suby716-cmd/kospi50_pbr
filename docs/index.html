n.compass-grid{grid-template-columns:repeat(4,minmax(0,1fr))}\n.compass-card{min-width:0;overflow:hidden}\n.compass-card>b{font-size:clamp(16px,1.23vw,19px)!important;line-height:1.48!important;letter-spacing:-.035em;word-break:keep-all!important;overflow-wrap:normal!important;hyphens:none}\n.compass-card .compass-desc{overflow-wrap:break-word}\n#compassTrend{font-size:clamp(15px,1.12vw,18px)!important;letter-spacing:-.055em}\n#taScan{background:#174f72!important;border-color:#174f72!important;color:#fff!important;font-weight:750;box-shadow:0 2px 5px rgba(23,79,114,.12);transition:background .15s ease,box-shadow .15s ease}\n#taScan:hover:not(:disabled){background:#103b57!important;box-shadow:0 3px 9px rgba(23,79,114,.18)}\n#taScan:disabled{background:#64748b!important;border-color:#64748b!important;color:#fff!important;opacity:.85;cursor:progress}\n#taScan:focus-visible{outline:3px solid #9ccce2;outline-offset:3px}\n.ta-signal-clarifier{margin:8px 0 4px;padding:9px 11px;background:#f4f8fc;border:1px solid #d9e4ef;border-radius:9px;color:#43566c;font-size:12px;line-height:1.65}\n@media(max-width:1150px){.compass-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:620px){.compass-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.compass-card>b{font-size:clamp(15px,3.65vw,18px)!important}#compassTrend{font-size:clamp(14px,3.4vw,17px)!important}.ta-signal-clarifier{font-size:12px}}\n@media(max-width:370px){.compass-grid{grid-template-columns:1fr 1fr}.compass-card{padding:10px!important}#compassTrend{font-size:14px!important}}\n\u003c/style>\n\u003cstyle id=\"qm-compact-optional\">\n/* Quantum research lab: compact optional section, preserving existing small labels */\n#quantumLab{padding:13px 15px;margin:12px 0}\n#quantumLab .qm-head h2{font-size:17px!important;line-height:1.4}\n#quantumLab .qm-head{gap:10px}\n#quantumLab .qm-actions{display:flex;gap:7px;flex-wrap:wrap}\n#quantumLab .qm-actions .btn{min-height:34px;padding:5px 10px;font-size:13px}\n er;font-size:17px;font-weight:750;line-height:1.5}\n#mmcResearch30 .mmcR30tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}\n#mmcResearch30 button{background:#f2f7fd;border:1px solid #bdcfe2;color:#174d7d;border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit}\n#mmcResearch30 .mmcR30status{font-size:14px;color:#53657a}\n#mmcResearch30 .mmcR30cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px;margin:12px 0}\n#mmcResearch30 .mmcR30card{background:#f5f8fc;padding:11px;border-radius:10px;min-width:0}\n#mmcResearch30 .mmcR30card b{display:block;font-size:17px;margin-top:5px}\n#mmcResearch30 table{width:100%;border-collapse:collapse;font-size:13px}\n#mmcResearch30 th,#mmcResearch30 td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}\n#mmcResearch30 .mmcR30table{max-height:340px;overflow:auto}\n@media(max-width:620px){#mmcResearch30{padding:12px}#mmcResearch30 .mmcR30cards{grid-template-columns:repeat(2,minmax(0,1fr))}}\n\u003c/style>\n\u003cstyle id=\"mmc-integrated-compact-style\">\n.mmc-decision-strip{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 14px;margin:10px 0;border:1px solid #d9e3ef;background:#f7faff;border-radius:12px;font-size:13px;line-height:1.55;color:#23364d}\n.mmc-decision-strip b{font-size:14px;color:#17416c}.mmc-decision-strip span{flex:1;min-width:220px}.mmc-decision-strip button{font-size:12px}\n#masterCompass .mmc-embedded-quantum{margin:7px 0;padding:8px 12px;border:1px solid #e3e9f1;border-radius:10px;background:white;box-shadow:none}\n#masterCompass .mmc-embedded-quantum .qm-head h2{font-size:14px!important}#masterCompass .mmc-embedded-quantum .qm-head .qm-muted{font-size:11px}\n#masterCompass .mmc-embedded-quantum .qm-compact-note{font-size:12px;padding:3px 0}\n#masterCompass .mmc-embedded-quantum .qm-chart{height:145px!important}\n#masterCompass #mmcResearch30{margin:7px 0 12px;border:1px solid #e3e9f1;border-radius:10px;padding:10px 12px;background:white}\n#masterCompass #mmcResearch30 summary{font-size:13px;font-weight:600;cursor:pointer}\n@media(max-width:680px){.mmc-decision-strip{align-items:flex-start}.mmc-decision-strip span{min-width:100%}.mmc-decision-strip button{margin-left:auto}#masterCompass .qm-charts{grid-template-columns:1fr!important}}\n\u003c/style>\n\u003cstyle id=\"ta-coin-button-chart-upgrade\">\n#taScanOut .ta-coin-select{appearance:none;border:1px solid #cbd5e1;background:#f8fafc;color:#164b70;font-weight:800;font-size:12px;border-radius:7px;padding:6px 9px;min-width:56px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}\n#taScanOut .ta-coin-select:hover{background:#e9f3ff;border-color:#70a9d5}\n#taScanOut .ta-coin-select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}\n#taScanOut .ta-coin-select[aria-pressed=\"true\"]{background:#e0f2fe;border-color:#0284c7;color:#075985;box-shadow:inset 0 0 0 1px #0284c7}\n.ta-chart-heading{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:14px 0 8px;padding:10px 12px;background:#f5f9fd;border:1px solid #dce7f1;border-radius:10px}\n.ta-chart-heading strong{font-size:23px;font-weight:900;color:#b91c1c;letter-spacing:.4px;background:#fff1f2;border:1px solid #fecdd3;border-radius:7px;padding:3px 10px}\n.ta-chart-heading span{font-size:12px;color:#64748b}\n@media(max-width:640px){#taScanOut .ta-coin-select{font-size:12px;padding:7px 6px;min-width:50px}.ta-chart-heading strong{font-size:21px}}\n\u003c/style>\n\u003cstyle id=\"ta-rsi-chart-style\">\n.ta-rsi-heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 2px 5px;font-size:12px;color:#334155}\n.ta-rsi-heading span{font-size:12px;color:#6d28d9;font-weight:650}\n.ta-rsi-chart{display:block;width:100%;height:132px;border:1px solid var(--line);border-radius:9px;background:#fff}\n@media(max-width:640px){.ta-rsi-chart{height:112px}.ta-rsi-heading{font-size:11px}}\n\u003c/style>\n\u003cstyle id=\"ta-tall-single-ema-style\">\n.ta-chart{height:550px!important;image-rendering:auto}\n.ta-rsi-chart{height:165px!important}\n.ta-latest-below{display:none!important;margin:8px 0 12px;padding:11px 14px;border:1px solid #cbd5e1;border-radius:9px;background:#f8fafc;font-size:14px;font-weight:800;line-height:1.55;color:#334155}\n.ta-latest-below.buy{border-color:#86cba2;background:#f0fdf4;color:#166534}\n.ta-latest-below.sell{border-color:#f4a6a6;background:#fef2f2;color:#991b1b}\n.ta-line-options select{font-size:13px;font-weight:700;padding:6px 8px;border:1px solid #cbd5e1;border-radius:7px;background:white;color:#1e293b}\n@media(max-width:640px){.ta-chart{height:490px!important}.ta-rsi-chart{height:145px!important}.ta-latest-below{font-size:13px}}\n\u003c/style>\n\u003cstyle id=\"ta-mobile-zoom-style\">\n.ta-chart-toolbar{display:flex;gap:7px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0 5px}\n.ta-chart-toolbar .ta-zoom-controls{display:flex;gap:6px;flex-wrap:wrap}\n.ta-zoom-btn{border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#334155;padding:8px 12px;font-size:13px;font-weight:750;cursor:pointer}\n.ta-zoom-btn[aria-pressed=\"true\"]{background:#eaf4ff;border-color:#3b82f6;color:#174c85}\n.ta-chart-scroll{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x pan-y;scrollbar-width:thin;border-radius:9px}\n.ta-chart-scroll .ta-chart{margin-top:0}\n.ta-zoom-hint{font-size:12px;color:#64748b}\n@media(max-width:640px){\n .ta-chart-scroll .ta-chart{height:570px!important;max-width:none!important}\n .ta-rsi-chart{height:175px!important}\n .ta-chart-toolbar{align-items:flex-start}\n .ta-zoom-btn{padding:9px 12px}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"head\">\n    \u003cdiv class=\"title\">\u003ch1>\u26a1 BTC ALT REGIME TRADER \u00b7 MASTER MARKET COMPASS\u003c/h1>\u003cdiv class=\"sub\">BTC \uc7a5\uae30 \uac00\uce58 \u00b7 \uae00\ub85c\ubc8c \uc720\ub3d9\uc131 \u00b7 Upbit KRW \uc2e4\uc2dc\uac04 \ubd84\uc11d \u00b7 Regime + Pattern \u00b7 Telegram \uc218\ub3d9\ub9e4\ub9e4 \uc54c\ub9bc\u003c/div>\u003c/div>\n    \u003cdiv class=\"status\">\u003cspan class=\"dot\" id=\"dot\">\u003c/span>\u003cspan id=\"status\">\uc5f0\uacb0 \uc900\ube44\uc911\u003c/span>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"workspace\">\n    \u003caside class=\"market-sidebar\">\n      \u003cdiv class=\"market-sidebar-head\">\n        \u003cdiv class=\"market-sidebar-title\">\ud83d\udcc8 \uc2e4\uc2dc\uac04 \ucf54\uc778 \ubaa8\ub2c8\ud130\u003c/div>\n        \u003cdiv class=\"market-sidebar-sub\">\ud604\uc7ac\uac00 \u00b7 24\uc2dc\uac04 \ubcc0\ub3d9 \u00b7 \uae40\ud504 \u00b7 24H \ubbf8\ub2c8\ucc28\ud2b8 \u00b7 Upbit KRW\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"market-search\">\u003cinput id=\"marketSearch\" placeholder=\"\ucf54\uc778\uba85 \ub610\ub294 \uc2ec\ubcfc \uac80\uc0c9\">\u003c/div>\u003cdiv class=\"market-manage\">\u003cinput id=\"marketAddSymbol\" placeholder=\"\uc2ec\ubcfc \ucd94\uac00 \uc608: ARB\">\u003cbutton id=\"marketAddBtn\">+ \ucd94\uac00\u003c/button>\u003cbutton id=\"marketResetBtn\">\uae30\ubcf8\uac12\u003c/button>\u003c/div>\n      \u003cdiv class=\"market-selected\" id=\"marketSelected\">\uc120\ud0dd: \u003cb>BTC \ube44\ud2b8\ucf54\uc778\u003c/b>\u003c/div>\n      \u003cdiv class=\"market-table-head\">\u003cdiv>\ucf54\uc778\u003c/div>\u003cdiv>\ud604\uc7ac\uac00\u003c/div>\u003cdiv>24H\u003c/div>\u003cdiv>\uae40\ud504\u003c/div>\u003cdiv>24H \ucc28\ud2b8\u003c/div>\u003c/div>\n      \u003cdiv class=\"market-list\" id=\"marketList\">\u003c/div>\n      \u003cdiv class=\"market-footer\">24\uc2dc\uac04 = Upbit \uc804\uc77c \uc885\uac00 \ub300\ube44 signed change rate \u00b7 \u003cb>\ud604\uc7ac \ubaa9\ub85d\uc740 24\uc2dc\uac04 \uc0c1\uc2b9\ub960 \uc21c\uc73c\ub85c \uc2e4\uc2dc\uac04 \uc7ac\uc815\ub82c\u003c/b> \u00b7 \uae40\ud504 = Upbit KRW \u00f7 (Binance USDT \u00d7 USD/KRW) - 1. \u00b7 \uc6b0\uce21 \uadf8\ub798\ud504 = \ucd5c\uadfc 24\uc2dc\uac04 1\uc2dc\uac04\ubd09\u003c/div>\n    \u003c/aside>\n    \u003cmain class=\"maincol\">\n  \u003cdiv class=\"grid\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">BTC \uac00\uaca9(KRW)\u003c/div>\u003cdiv class=\"value\" id=\"btc\">\u2014\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">BTC RSI 5m\u003c/div>\u003cdiv class=\"value\" id=\"brsi\">\u2014\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">BTC 5m\u003c/div>\u003cdiv class=\"value\" id=\"bret\">\u2014\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">\ub300\uc138 Regime\u003c/div>\u003cdiv class=\"value\" id=\"regime\">\u2014\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">\ucd5c\uace0 Score\u003c/div>\u003cdiv class=\"value\" id=\"top\">\u2014\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">\ucd5c\uace0 \uc2e0\ub8b0\ub3c4\u003c/div>\u003cdiv class=\"value\" id=\"conf\">\u2014\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">\ub9c8\uc9c0\ub9c9 \uc644\ub8cc\ubd09\u003c/div>\u003cdiv class=\"value\" id=\"candle\">\u2014\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"panel as-panel\" id=\"asPanel\">\n  \u003cdiv class=\"section-title\">\ud83c\udf0d GLOBAL LIQUIDITY & ALTSEASON RADAR \u003cspan id=\"asSub\">\uc720\ub3d9\uc131 \u00b7 BTC.D \u00b7 ETH/BTC \u00b7 \uc2e4\uc81c \uc54c\ud2b8 \ud655\uc0b0\uc744 \ud568\uaed8 \ubcf4\ub294 \ub370\uc774\ud130 \uae30\ubc18 \ub808\uc774\ub354\u003c/span>\n    \u003cbutton class=\"btn mini-btn as-reload\" id=\"asReload\" type=\"button\">\uc0c8\ub85c\uace0\uce68\u003c/button>\u003c/div>\n  \u003cdiv class=\"as-top\">\n    \u003cdiv class=\"as-scorecard\">\n      \u003cdiv class=\"label\">ALTSEASON SCORE\u003c/div>\n      \u003cdiv class=\"as-score\" id=\"asScore\">\u2014\u003c/div>\n      \u003cdiv class=\"as-stage\" id=\"asStage\">\uacc4\uc0b0 \uc911\u2026\u003c/div>\n      \u003cdiv class=\"as-gauge\">\u003ci class=\"g1\">\u003c/i>\u003ci class=\"g2\">\u003c/i>\u003ci class=\"g3\">\u003c/i>\u003ci class=\"g4\">\u003c/i>\u003cb id=\"asMarker\">\u003c/b>\u003c/div>\n      \u003cdiv class=\"as-gauge-lab\">\u003cspan>0\u003c/span>\u003cspan id=\"asWatchLab\">\u2014\u003c/span>\u003cspan id=\"asExpandLab\">\u2014\u003c/span>\u003cspan id=\"asBroadLab\">\u2014\u003c/span>\u003cspan>100\u003c/span>\u003c/div>\n      \u003cdiv class=\"as-path\" id=\"asPath\">\u2014\u003c/div>\n      \u003cdiv class=\"as-mom\" id=\"asMom\">\u003c/div>\n      \u003cdiv class=\"as-badges\" id=\"asScoreBadges\">\u003c/div>\n      \u003cdiv class=\"altseason-note\">\uc784\uc758\uc758 40/70 \uace0\uc815\uc810\uc218\uac00 \uc544\ub2c8\ub77c \uacfc\uac70 60\uac1c\uc6d4 \ubd84\ud3ec\ub85c \uc790\ub3d9 \ubcf4\uc815 \u00b7 \ub9e4\ub9e4\uc2e0\ud638 \uc544\ub2d8\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"as-comps\" id=\"asComps\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"as-drivers\" id=\"asDrivers\">\u003c/div>\n\n  \u003cdiv class=\"as-tabs\" id=\"asTabs\">\n    \u003cbutton type=\"button\" data-m=\"score\" class=\"on\">ALTSEASON SCORE\u003c/button>\n    \u003cbutton type=\"button\" data-m=\"m2\">Global M2 YoY\u003c/button>\n    \u003cbutton type=\"button\" data-m=\"dom\">BTC.D\u003c/button>\n    \u003cbutton type=\"button\" data-m=\"eth\">ETH/BTC\u003c/button>\n  \u003c/div>\n  \u003ccanvas id=\"asChart\" class=\"as-chart\">\u003c/canvas>\n  \u003cdiv class=\"as-caption\" id=\"asCaption\">\ucc28\ud2b8 \uc704\uc5d0 \ub9c8\uc6b0\uc2a4\ub97c \uc62c\ub9ac\uba74 \uc6d4\ubcc4 \uac12\uc774 \ud45c\uc2dc\ub429\ub2c8\ub2e4.\u003c/div>\n  \u003cdiv class=\"as-legend\" id=\"asLegend\">\u003c/div>\n\n  \u003csection class=\"ta-lab\" id=\"taSignalLab\">\n    \u003cdiv class=\"ta-lab-head\">\n      \u003cdiv>\n        \u003cb>\ud83d\udcc8 TA SIGNAL LAB \u00b7 \ubcfc\ub9b0\uc800 \u00b7 \ud328\ud134 \u00b7 \uc2b9\ub960\u003c/b>\n        \u003cdiv class=\"small\" id=\"taStatus\">\uc8fc\uc694 \ucf54\uc778 \uce94\ub4e4 \uae30\ubc18 \ubcfc\ub9b0\uc800\ubc34\ub4dc\u00b7\ud328\ud134 \uc2e0\ud638\uc640 \uacfc\uac70 \uc2b9\ub960\uc744 \uacc4\uc0b0\ud569\ub2c8\ub2e4.\u003c/div>\n      \u003c/div>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"taReload\">\uc2e0\ud638 \ub2e4\uc2dc \uacc4\uc0b0\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"ta-controls\">\n      \u003clabel class=\"small\">\ucf54\uc778\n        \u003cselect id=\"taSymbol\">\u003coption value=\"BTC\">BTC\u003c/option>\u003c/select>\n      \u003c/label>\n      \u003clabel class=\"small\">\ubd09\n        \u003cselect id=\"taFrame\">\n          \u003coption value=\"5m\">5\ubd84\ubd09\u003c/option>\n          \u003coption value=\"day\" selected>\uc77c\ubd09\u003c/option>\n        \u003c/select>\n      \u003c/label>\n      \u003clabel class=\"small\">\ubcf4\uc720 \ud3c9\uac00 \uad6c\uac04\n        \u003cselect id=\"taHorizon\">\n          \u003coption value=\"3\">3\ubd09 \ud6c4\u003c/option>\n          \u003coption value=\"6\">6\ubd09 \ud6c4\u003c/option>\n          \u003coption value=\"12\" selected>12\ubd09 \ud6c4\u003c/option>\n          \u003coption value=\"24\">24\ubd09 \ud6c4\u003c/option>\n          \u003coption value=\"48\">48\ubd09 \ud6c4\u003c/option>\n        \u003c/select>\n      \u003c/label>\n      \u003clabel class=\"small\">\uc2dc\uc7a5 \uad6d\uba74 \u003cselect id=\"taRegime\">\u003coption value=\"all\">\uc804\uccb4\u003c/option>\u003coption value=\"trend\">\ucd94\uc138\uc7a5(ADX\u226525)\u003c/option>\u003coption value=\"range\">\ud6a1\ubcf4\uc7a5(ADX&lt;25)\u003c/option>\u003coption value=\"btcup\">BTC \uc0c1\uc2b9\ucd94\uc138(EMA50 \uc704)\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel class=\"small\">\uccad\uc0b0 \ubc29\uc2dd \u003cselect id=\"taExit\">\u003coption value=\"time\">\ubcf4\uc720\ubd09 \uc885\uac00\u003c/option>\u003coption value=\"atr\">ATR \uc190\uc808\u00b7\ubaa9\ud45c\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel class=\"small\">\uc218\uc218\ub8cc\u00b7\uc2ac\ub9ac\ud53c\uc9c0(%) \u003cinput id=\"taFee\" type=\"number\" step=\"0.01\" min=\"0\" max=\"2\" value=\"0.10\" style=\"width:72px\">\u003c/label>\n      \u003cspan class=\"ta-scan-control\">\u003cbutton type=\"button\" class=\"btn\" id=\"taScan\">\uc804\uccb4 \ucf54\uc778 \uc2a4\uce94\u003c/button>\u003cspan id=\"taScanProgress\" role=\"status\" aria-live=\"polite\">\ub300\uae30 \uc911\u003c/span>\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"ta-coin-manager\">\n      \u003cb class=\"small\">\ubd84\uc11d \ucf54\uc778 \uad00\ub9ac\u003c/b>\n      \u003cinput id=\"taAddSymbol\" maxlength=\"80\" placeholder=\"\uc608: HBAR, ARB, OP (\uc5ec\ub7ec \uac1c \uac00\ub2a5)\" aria-label=\"\ucd94\uac00\ud560 \ucf54\uc778 \uc2ec\ubcfc\">\n      \u003cbutton type=\"button\" class=\"btn\" id=\"taAddCoin\">\ucf54\uc778 \ucd94\uac00\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"taResetCoins\">\uae30\ubcf8 \ubaa9\ub85d\u003c/button>\n      \u003cspan class=\"small\" id=\"taCoinCount\">0\uac1c\u003c/span>\n      \u003cdiv class=\"ta-coin-chips\" id=\"taCoinChips\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"ta-metrics\" id=\"taMetrics\">\n      \u003cspan>\ud604\uc7ac\uac00 \u2014\u003c/span>\u003cspan>BB \uc704\uce58 \u2014\u003c/span>\u003cspan>RSI \u2014\u003c/span>\u003cspan>\ucd5c\uadfc \uc2e0\ud638 \u2014\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"ta-note\" id=\"taGate\" style=\"font-size:12px;color:inherit;margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);line-height:1.7\">\u003c/div>\n    \u003cdiv class=\"ta-note\" id=\"taVerdict\" style=\"font-size:12px;color:inherit;margin-top:10px\">\u003c/div>\n    \u003cdiv id=\"taScanOut\" style=\"overflow-x:auto;margin-top:8px\">\u003c/div>\n    \u003cdiv class=\"ta-chart-heading\" id=\"taChartHeading\" role=\"heading\" aria-level=\"3\">\u003cstrong id=\"taChartSymbol\">BTC\u003c/strong>\u003cspan id=\"taChartContext\">\uc120\ud0dd\ud55c \ucf54\uc778\uc758 \ucc28\ud2b8 \u00b7 \ucd5c\uadfc 120\ubd09\u003c/span>\u003c/div>\n    \u003cdiv id=\"taSignalReasons\" class=\"ta-signal-reasons\" aria-live=\"polite\">\ucf54\uc778\uc744 \uc120\ud0dd\ud558\uba74 \uac00\uc7a5 \ucd5c\uadfc \ub9e4\uc218 \ub610\ub294 \ub9e4\ub3c4 \uc2e0\ud638 \ud558\ub098\uc758 \ubc1c\uc0dd \uc774\uc720\uac00 \ud45c\uc2dc\ub429\ub2c8\ub2e4.\u003c/div>\n    \u003cdiv class=\"ta-line-options\">\u003cspan id=\"taLineLegend\">\u003cb>\ud45c\uc2dc:\u003c/b> \ubcfc\ub9b0\uc800\ubc34\ub4dc \uc0c1\u00b7\uc911\u00b7\ud558\ub2e8\u003c/span>\u003cdiv class=\"ta-overlay-buttons\" role=\"group\" aria-label=\"\ucc28\ud2b8 \ubcf4\uc870\uc120 \ud558\ub098 \uc120\ud0dd\">\u003cbutton type=\"button\" class=\"ta-overlay-btn\" data-ta-overlay=\"bb\" aria-pressed=\"true\">\ubcfc\ub9b0\uc800\ubc34\ub4dc\u003c/button>\u003cbutton type=\"button\" class=\"ta-overlay-btn\" data-ta-overlay=\"ema20\" aria-pressed=\"false\">EMA20\u003c/button>\u003cbutton type=\"button\" class=\"ta-overlay-btn\" data-ta-overlay=\"ema50\" aria-pressed=\"false\">EMA50\u003c/button>\u003cbutton type=\"button\" class=\"ta-overlay-btn\" data-ta-overlay=\"ema120\" aria-pressed=\"false\">EMA120\u003c/button>\u003cbutton type=\"button\" class=\"ta-overlay-btn\" data-ta-overlay=\"ema200\" aria-pressed=\"false\">EMA200\u003c/button>\u003c/div>\u003cinput type=\"hidden\" id=\"taLineMode\" value=\"bb\">\u003c/div>\n    \u003cdiv class=\"ta-chart-toolbar\">\u003cdiv class=\"ta-zoom-controls\" role=\"group\" aria-label=\"\ucc28\ud2b8 \ubd09 \ud45c\uc2dc \ubc29\uc2dd\">\u003cbutton type=\"button\" id=\"taZoom40\" class=\"ta-zoom-btn\" aria-pressed=\"true\">\ucd5c\uadfc 40\uc77c\ubd09 \ud655\ub300\u003c/button>\u003cbutton type=\"button\" id=\"taZoom120\" class=\"ta-zoom-btn\" aria-pressed=\"false\">\ucd5c\uadfc 120\uc77c\ubd09\u003c/button>\u003c/div>\u003cspan id=\"taZoomHint\" class=\"ta-zoom-hint\">\ubaa8\ubc14\uc77c: \uc88c\uc6b0\ub85c \ubc00\uc5b4 \uacfc\uac70 \ucc28\ud2b8 \ud655\uc778\u003c/span>\u003c/div>\u003cdiv class=\"ta-chart-scroll\" id=\"taChartScroll\">\u003ccanvas id=\"taChart\" class=\"ta-chart\" aria-label=\"\uce94\ub4e4 \ucc28\ud2b8, \ubcfc\ub9b0\uc800\ubc34\ub4dc \ub610\ub294 \uc120\ud0dd\ud55c EMA \ud55c \uac1c, \ub9e4\uc218\ub9e4\ub3c4 \uc2e0\ud638 \uc0bc\uac01\ud615\">\u003c/canvas>\u003c/div>\u003cdiv id=\"taChartLatestLabel\" class=\"ta-latest-below\" aria-live=\"polite\">\ucd5c\uc2e0 \uc2e0\ud638\ub97c \uacc4\uc0b0 \uc911\uc785\ub2c8\ub2e4.\u003c/div>\n    \u003cdiv class=\"ta-rsi-heading\">\u003cb>RSI (14) \u00b7 \uc0c1\ub300\uac15\ub3c4\uc9c0\uc218\u003c/b>\u003cspan id=\"taRsiCurrent\">\ud604\uc7ac RSI \u2014\u003c/span>\u003c/div>\n    \u003ccanvas id=\"taRsiChart\" class=\"ta-rsi-chart\" aria-label=\"RSI 14 \uadf8\ub798\ud504, \uacfc\ub9e4\uc218 70\uacfc \uacfc\ub9e4\ub3c4 30 \uae30\uc900\uc120\">\u003c/canvas>\n    \u003cdiv class=\"ta-signal-clarifier\">\u25b2 \ucd08\ub85d\uc0c9 = \uae30\uc220\uc801 \ub9e4\uc218 \ud6c4\ubcf4 \u00b7 \u25bc \ube68\uac04\uc0c9 = \uae30\uc220\uc801 \ub9e4\ub3c4/\uc704\ud5d8 \ud6c4\ubcf4. BTC \uad6d\uba74\uc774 \ub9e4\uc218\ub97c \uc81c\ud55c\ud560 \ub54c\uc5d0\ub3c4 \uacfc\uac70 \uae30\uc220 \uc2e0\ud638\ub294 \ucc28\ud2b8\uc5d0 \ub0a8\uc2b5\ub2c8\ub2e4. \uc2e4\uc81c \ub9e4\ub9e4 \ud310\ub2e8\uc740 \uc704\uc758 \u003cb>\uc5f0\uacb0 \ud310\uc815\u003c/b>\uc744 \ud568\uaed8 \ud655\uc778\ud558\uc138\uc694. \ud45c\uc2dc\ub41c \ud655\ub960\uc740 \ud45c\ubcf8\u00b7\uae30\uac04\u00b7\uac70\ub798\ube44\uc6a9\uc5d0 \uc601\ud5a5\uc744 \ubc1b\ub294 \uacfc\uac70 \ucd94\uc815\uce58\uc785\ub2c8\ub2e4.\u003c/div>\n    \u003cdiv class=\"ta-legend\">\n      \u003cspan>\ucd08\ub85d\u00b7\ube68\uac15 \uce94\ub4e4 = \uc2dc\uac00\u00b7\uc885\uac00\u00b7\uace0\uac00\u00b7\uc800\uac00\u003c/span>\n      \u003cspan>\u003ci class=\"bb\">\u003c/i>\ud68c\uc0c9: BB \uc0c1\u00b7\ud558\ub2e8 / \ubcf4\ub77c\uc0c9: BB20 \uc911\uc2ec\uc120\u003c/span>\n      \u003cspan>\u003ci class=\"buy\">\u003c/i>\ub9e4\uc218 \uc2e0\ud638\u003c/span>\n      \u003cspan>\u003ci class=\"sell\">\u003c/i>\ub9e4\ub3c4 \uc2e0\ud638\u003c/span>\n      \u003cspan>\ub9c8\uc9c0\ub9c9 \ub9e4\uc218\u00b7\ub9e4\ub3c4 \uc0bc\uac01\uc810\uc5d0 \ubcf4\uc815\ud655\ub960 \ud45c\uc2dc \u00b7 \ud45c\ubcf8 \ubd80\uc871 \uc2dc \ud655\ub960 \ub300\uc2e0 \uc548\ub0b4 \u00b7 \uc0bc\uac01\uc810\uc744 \ud0ed/\ud638\ubc84\ud558\uba74 \uc0c1\uc138 \ud655\uc778\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"overflow-x:auto;margin-top:10px\">\n      \u003ctable class=\"ta-table\" id=\"taWinTable\">\n        \u003cthead>\u003ctr>\u003cth>\uc2e0\ud638\u003c/th>\u003cth>\uc720\ud615\u003c/th>\u003cth>\ud45c\ubcf8\u003c/th>\u003cth>\uc2b9\ub960\u003c/th>\u003cth>\uae30\uc800\u003c/th>\u003cth>\ubcf4\uc815\ud655\ub960\u003c/th>\u003cth>95% \uad6c\uac04\u003c/th>\u003cth>\ud3c9\uade0 \uc21c\uc218\uc775\u003c/th>\u003cth>OOS(\ucd5c\uadfc30%)\u003c/th>\u003cth>\ucd5c\uadfc \ubc1c\uc0dd\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\u003ctr>\u003ctd colspan=\"10\" style=\"text-align:center;color:var(--muted)\">\uacc4\uc0b0 \uc911\u2026\u003c/td>\u003c/tr>\u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cdiv class=\"ta-note\" id=\"taNotes\">\uc2b9\ub960 = \uc2e0\ud638 \uc774\ud6c4 N\ubd09 \uc885\uac00 \uae30\uc900 \uc218\uc775\uc774 0% \ucd08\uacfc\uc778 \ube44\uc728\uc785\ub2c8\ub2e4. \uc218\uc218\ub8cc\u00b7\uc2ac\ub9ac\ud53c\uc9c0 \ubbf8\ubc18\uc601. \ud45c\ubcf8\uc774 \uc801\uc73c\uba74 \ucc38\uace0\ub9cc \ud558\uc138\uc694. \ub2e8\ub3c5 \ub9e4\ub9e4 \uc2e0\ud638\uac00 \uc544\ub2d9\ub2c8\ub2e4.\u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"history-wrap\" id=\"asStrategyLab\">\n    \u003cdiv class=\"history-title\">\ud83e\uddea ALTSEASON \uc2e4\uc804 \uc804\ub7b5 \uac80\uc99d\uc2e4\n      \u003cspan class=\"as-mute\">\uc810\uc218 \uae30\ubc18 \ub9e4\uc9d1\u00b7\ubd84\ud560\ub9e4\ub3c4 5c \uc0dd\uc874\ud3b8\ud5a5\uc774 \uc788\uace0, \uc0c1\uc7a5\ud3d0\uc9c0\u00b7\uac70\ub798\uc911\ub2e8\u00b7\ud638\uac00\ucda9\uaca9\u00b7\uc138\uae08\u00b7\uc2e4\uc81c \uccb4\uacb0 \uc624\ucc28\ub97c \uc644\uc804\ud788 \ubc18\uc601\ud558\uc9c0 \ubabb\ud569\ub2c8\ub2e4. SCORE\uc758 \uacfc\uac70 \uacc4\uc0b0 \ubc29\uc2dd\uc774 \ud604\uc7ac\uc640 \ub2ec\ub790\ub358 \uad6c\uac04\uc740 \ubcc4\ub3c4 \ud574\uc11d\uc774 \ud544\uc694\ud569\ub2c8\ub2e4. \uacb0\uacfc\ub97c \uc2e4\uc804 \ub9e4\uc218\u00b7\ub9e4\ub3c4 \uc2e0\ud638\ub85c \uc0ac\uc6a9\ud558\uc9c0 \ub9d0\uace0 \ud398\uc774\ud37c \ud2b8\ub808\uc774\ub529\uc73c\ub85c \uba3c\uc800 \ud655\uc778\ud558\uc138\uc694.\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"as-ladder-box\">\n    \u003cdiv class=\"history-title\">\ud83e\ude9c \uc790\uae08 \uc21c\ud658 \uc0ac\ub2e4\ub9ac \u003cspan class=\"as-mute\">\ucd5c\uadfc 30\uc77c BTC \ub300\ube44 \ucd08\uacfc\uc218\uc775 \u00b7 \uc5c5\ube44\ud2b8 \uc6d0\ud654\ub9c8\ucf13 15\uc885\u003c/span>\u003c/div>\n    \u003cdiv class=\"as-ladder\" id=\"asLadder\">\u003c/div>\n    \u003cdiv class=\"as-mute\" id=\"asLadderNote\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"as-two\">\n    \u003cdiv class=\"history-wrap\">\n      \u003cdiv class=\"history-title\">\ud83d\udcd0 \uc810\uc218 \ubcf4\uc815\ud45c \u003cspan class=\"as-mute\">\uba87 \uc810\ubd80\ud130 \uc54c\ud2b8 \ud655\uc0b0\uc774 \uc2dc\uc791\ub410\ub098\u003c/span>\u003c/div>\n      \u003cdiv id=\"asCalib\" class=\"history-table\">\uacc4\uc0b0 \uc911\u2026\u003c/div>\n      \u003cdiv id=\"asWin\" class=\"history-table\" style=\"margin-top:8px\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"history-wrap\">\n      \u003cdiv class=\"history-title\">\ud83e\udded \uc9c0\uae08\uacfc \ube44\uc2b7\ud588\ub358 \uacfc\uac70 \uc2dc\uae30 \u003cspan class=\"as-mute\">M2\u00b7Fed\u00b7\ub2ec\ub7ec\u00b7BTC\u00b7ETH/BTC\u00b7BTC.D 6\uac1c \uc9c0\ud45c \uac70\ub9ac\u003c/span>\u003c/div>\n      \u003cdiv id=\"asAnalogs\" class=\"as-analogs\">\uacc4\uc0b0 \uc911\u2026\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"as-metrics\" id=\"asMetrics\">\u003c/div>\n  \u003cdiv class=\"macro-context\" id=\"asFoot\">\ub370\uc774\ud130 \uc5f0\uacb0 \uc911\u2026\u003c/div>\n\u003c/div>\n\n\n\u003csection class=\"panel compass-panel\" id=\"masterCompass\">\n  \u003cdiv class=\"compass-head\">\u003cdiv>\u003cdiv class=\"compass-title\">\ud83e\udded MASTER MARKET COMPASS \u003cspan>BTC \uc7a5\uae30 \uac00\uce58 \u2192 \uc0c1\uc2b9\uc7a5 \ud655\uc778 \u2192 \uc54c\ud2b8 \uc21c\ud658\ub9e4 \u2192 \uacfc\uc5f4 \ubd84\ud560\ub9e4\ub3c4\u003c/span>\u003c/div>\u003cdiv class=\"small\" id=\"compassStatus\">\uc7a5\uae30 BTC \uc6d4\ubd09 \ub370\uc774\ud130 \uc5f0\uacb0 \uc911\u2026\u003c/div>\u003c/div>\u003cbutton type=\"button\" class=\"btn\" id=\"compassReload\">\uc7a5\uae30 \ub370\uc774\ud130 \uc0c8\ub85c\uace0\uce68\u003c/button>\u003c/div>\n  \u003cdiv class=\"mmc-decision-strip\" id=\"mmcDecisionStrip\" role=\"status\" aria-live=\"polite\">\u003cb>\uc624\ub298\uc758 \uc7a5\uae30 \ud310\ub2e8\u003c/b>\u003cspan id=\"mmcDecisionText\">BTC \uad6d\uba74\u00b7\uc790\uae08\uc21c\ud658\u00b7TA \ubd84\uc11d\uc744 \ud655\uc778 \uc911\uc785\ub2c8\ub2e4. \uc5f0\uad6c \ub370\uc774\ud130\uac00 \uc5c6\uc73c\uba74 \ub9e4\uc218 \ud655\uc2e0\uc744 \ud45c\uc2dc\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.\u003c/span>\u003cbutton type=\"button\" class=\"btn\" id=\"mmcCheckApi\">\ub370\uc774\ud130 \uc9c4\ub2e8\u003c/button>\u003c/div>\u003cdiv class=\"qm-panel mmc-embedded-quantum\" id=\"quantumLab\">\n\u003cdiv class=\"qm-head\">\u003cdiv>\u003ch2 style=\"margin:0\">\uae08\u00b7\uad6c\ub9ac\u00b7\uae08\ub9ac\ucc28 \ubcf4\uc870\ubd84\uc11d\u003c/h2>\u003cdiv class=\"qm-muted\">\uac80\uc99d\ub41c \ub370\uc774\ud130\uac00 \uc788\uc744 \ub54c\ub9cc \uadf8\ub798\ud504 \ud45c\uc2dc\u003c/div>\u003c/div>\u003cdiv class=\"qm-actions\">\u003cbutton class=\"btn\" type=\"button\" id=\"qmToggle\" aria-expanded=\"false\" aria-controls=\"qmDetails\">\uc0c1\uc138 \uadf8\ub798\ud504 \ud3bc\uce58\uae30 \u25be\u003c/button>\u003cbutton class=\"btn\" type=\"button\" id=\"qmRefresh\" hidden>\ub370\uc774\ud130 \uc0c8\ub85c\uace0\uce68\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"qm-compact-note\" id=\"qmSummary\">\ubcf4\uc870 \uc5f0\uad6c \uc9c0\ud45c \u00b7 \uae30\ubcf8 \uc811\ud798 \u00b7 \uc0c1\uc138 \ubcf4\uae30\uc5d0\uc11c \ub370\uc774\ud130 \uc0c1\ud0dc\ub97c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.\u003c/div>\n\u003cdiv id=\"qmDetails\" hidden>\n\u003cdiv class=\"qm-muted\" id=\"qmStatus\">\uc5f0\uad6c \ub370\uc774\ud130 \uc5f0\uacb0 \ub300\uae30\u003c/div>\u003cdiv class=\"qm-grid\" id=\"qmCards\">\u003c/div>\n\u003cdiv class=\"qm-charts qm-comparison-grid\">\n\u003cdiv class=\"qm-plot\">\u003ch3>\uae08\uacfc \ube44\ud2b8\ucf54\uc778 \uac00\uaca9 \ube44\uad50\u003c/h3>\u003cp class=\"qm-help\">\uac19\uc740 \uc2dc\uc791\uc810\uc744 100\uc73c\ub85c \ub9de\ucdc4\uc2b5\ub2c8\ub2e4. \ud30c\ub780\uc0c9 BTC\uc640 \ud669\uae08\uc0c9 \uae08\uc758 \uc0c1\uc2b9\ud3ed\uc744 \uc9c1\uc811 \ube44\uad50\ud558\uc138\uc694.\u003c/p>\u003cdiv class=\"qm-legend\">\u003cspan class=\"qm-legend-btc\">\u25cf BTC\u003c/span>\u003cspan class=\"qm-legend-gold\">\u25cf \uae08\u003c/span>\u003c/div>\u003ccanvas class=\"qm-chart\" id=\"qmGoldCompare\">\u003c/canvas>\u003cp class=\"qm-insight\" id=\"qmGoldInsight\">\ub370\uc774\ud130 \ud655\uc778 \uc911\u2026\u003c/p>\u003c/div>\n\u003cdiv class=\"qm-plot\">\u003ch3>\uad6c\ub9ac\uc640 \ube44\ud2b8\ucf54\uc778 \uac00\uaca9 \ube44\uad50\u003c/h3>\u003cp class=\"qm-help\">\uac19\uc740 \uc2dc\uc791\uc810\uc744 100\uc73c\ub85c \ub9de\ucdc4\uc2b5\ub2c8\ub2e4. \ud30c\ub780\uc0c9 BTC\uc640 \uad6c\ub9ac\uc0c9 \uad6c\ub9ac\uc758 \uc0c1\ub300 \uc218\uc775\ub960\uc744 \ube44\uad50\ud558\uc138\uc694.\u003c/p>\u003cdiv class=\"qm-legend\">\u003cspan class=\"qm-legend-btc\">\u25cf BTC\u003c/span>\u003cspan class=\"qm-legend-copper\">\u25cf \uad6c\ub9ac\u003c/span>\u003c/div>\u003ccanvas class=\"qm-chart\" id=\"qmCopperCompare\">\u003c/canvas>\u003cp class=\"qm-insight\" id=\"qmCopperInsight\">\ub370\uc774\ud130 \ud655\uc778 \uc911\u2026\u003c/p>\u003c/div>\n\u003cdiv class=\"qm-plot\">\u003ch3>\uae08/BTC \uc0c1\ub300\uac15\ub3c4 (\uc2dc\uc791\uc810 100)\u003c/h3>\u003cp class=\"qm-help\">\uc0c1\uc2b9\ud558\uba74 \uae08\uc774 BTC\ubcf4\ub2e4 \uac15\ud558\uace0, \ud558\ub77d\ud558\uba74 BTC\uac00 \uae08\ubcf4\ub2e4 \uac15\ud569\ub2c8\ub2e4.\u003c/p>\u003ccanvas class=\"qm-chart\" id=\"qmGold\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"qm-plot\">\u003ch3>\uad6c\ub9ac/BTC \uc0c1\ub300\uac15\ub3c4 (\uc2dc\uc791\uc810 100)\u003c/h3>\u003cp class=\"qm-help\">\uc0c1\uc2b9\ud558\uba74 \uad6c\ub9ac\uac00 BTC\ubcf4\ub2e4 \uac15\ud558\uace0, \ud558\ub77d\ud558\uba74 BTC\uac00 \uad6c\ub9ac\ubcf4\ub2e4 \uac15\ud569\ub2c8\ub2e4.\u003c/p>\u003ccanvas class=\"qm-chart\" id=\"qmCopper\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"qm-plot\">\u003ch3>\ubbf8\uad6d 10\ub144 \u2212 2\ub144 \uae08\ub9ac\ucc28 (%p)\u003c/h3>\u003cp class=\"qm-help\">0\ubcf4\ub2e4 \ub0ae\uc73c\uba74 \uc7a5\ub2e8\uae30 \uae08\ub9ac \uc5ed\uc804\uc785\ub2c8\ub2e4. \uacbd\uae30\uce68\uccb4 \ud655\uc815 \uc2e0\ud638\ub294 \uc544\ub2d9\ub2c8\ub2e4.\u003c/p>\u003ccanvas class=\"qm-chart\" id=\"qmCurve\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"qm-plot\">\u003ch3>\ubbf8\uad6d 10\ub144 \u2212 3\uac1c\uc6d4 \uae08\ub9ac\ucc28 (%p)\u003c/h3>\u003cp class=\"qm-help\">\ubbf8\uad6d \uc7ac\ubb34\ubd80 \uacf5\uac1c \uc790\ub8cc\ub85c \uacc4\uc0b0\ud569\ub2c8\ub2e4. \uac1c\uc778\uc815\ubcf4 \ub4f1\ub85d\u00b7FRED \ud0a4\uac00 \ud544\uc694 \uc5c6\uc2b5\ub2c8\ub2e4.\u003c/p>\u003ccanvas class=\"qm-chart\" id=\"qmCurve3\">\u003c/canvas>\u003cp class=\"qm-insight\" id=\"qmYieldInfo\">\uae08\ub9ac \ub370\uc774\ud130 \ud655\uc778 \uc911\u2026\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"qm-table\" id=\"qmCorr\">\u003c/div>\u003cdiv class=\"qm-muted\" id=\"qmQuality\">\u003c/div>\n\u003cp class=\"qm-muted\">\uc5f0\uad6c\uc6a9 \ubcf4\uc870\uc9c0\ud45c\uc774\uba70 \ub9e4\ub9e4 \uc2e0\ud638\uac00 \uc544\ub2d9\ub2c8\ub2e4. \uc6d0\uc790\uc7ac \uac00\uaca9 \ub2e8\uc704\u00b7\uac70\ub798\uc2dc\uac04\u00b7\uc120\ubb3c \ub864\uc624\ubc84, \ub370\uc774\ud130 \uacb0\uce21 \ubc0f \uc0c1\uad00\uad00\uacc4\uc758 \ube44\uc778\uacfc\uc131\uc744 \uc720\uc758\ud558\uc138\uc694. MVRV\u00b7\uc628\uccb4\uc778\u00b7\uc2e4\uc81c ETF \uc790\uae08\uc720\uc785 \ub4f1 \ubbf8\uac80\uc99d \ud56d\ubaa9\uc740 \uc774 \uc5f0\uad6c\uc2e4\uc5d0\uc11c \uacc4\uc0b0\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.\u003c/p>\u003c/div>\n\u003c/div>\u003cdetails id=\"mmcResearch30\">\u003csummary>30\uac1c \uc5f0\uad6c \ub370\uc774\ud130\u00b7\uac80\uc99d \uc0c1\uc138 (\ud544\uc694\ud560 \ub54c \ud3bc\uce58\uae30)\u003c/summary>\n\u003cdiv class=\"mmcR30tools\">\u003cbutton type=\"button\" id=\"mmcR30Refresh\">\uc2e4\uc81c \ub370\uc774\ud130 \ud655\uc778\u003c/button>\u003cspan class=\"mmcR30status\" id=\"mmcR30Status\">\ud3bc\uce5c \ub4a4 \ubc84\ud2bc\uc744 \ub204\ub974\uba74 \uc5f0\uacb0 \uc0c1\ud0dc\ub97c \ud655\uc778\ud569\ub2c8\ub2e4.\u003c/span>\u003c/div>\n\u003cdiv class=\"mmcR30cards\" id=\"mmcR30Cards\">\u003c/div>\u003cdiv class=\"mmcR30table\" id=\"mmcR30Table\">\u003c/div>\n\u003cp style=\"font-size:13px;color:#53657a\">\ubbf8\ud655\ubcf4\ub41c MVRV\u00b7ETF \uc21c\uc720\uc785\u00b7\uc5b8\ub77d\uc740 \ucd94\uc815\uce58\ub85c \ub300\uccb4\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \ubc31\ud14c\uc2a4\ud2b8\ub294 BTC \uc885\uac00 \ub370\uc774\ud130 \ud655\ubcf4 \uae30\uac04\uc5d0\ub9cc \uc218\ud589\ud558\uba70 \uc218\uc775 \ubcf4\uc7a5\uc774 \uc544\ub2d9\ub2c8\ub2e4.\u003c/p>\u003c/details>\n  \u003cdiv class=\"compass-grid\">\n    \u003carticle class=\"compass-card\">\u003cdiv class=\"compass-kicker\">01 \u00b7 BTC \uc7a5\uae30 \uac00\uce58\u003c/div>\u003cb id=\"compassValue\">\u2014\u003c/b>\u003cdiv class=\"compass-desc\" id=\"compassValueDesc\">Power-law \ubd84\uc704\ud68c\uadc0 \ubc34\ub4dc \u00b7 2011\ub144 \uc774\ud6c4 \uc6d4\ub9d0 \uc885\uac00\u003c/div>\u003c/article>\n    \u003carticle class=\"compass-card\">\u003cdiv class=\"compass-kicker\">02 \u00b7 \uc0c1\uc2b9\uc7a5 \uc804\ud658\u003c/div>\u003cb id=\"compassTrend\">\u2014\u003c/b>\u003cdiv class=\"compass-desc\" id=\"compassTrendDesc\">10\uac1c\uc6d4 \ud3c9\uade0 \u00b7 3\uac1c\uc6d4 \ubaa8\uba58\ud140\u003c/div>\u003c/article>\n    \u003carticle class=\"compass-card\">\u003cdiv class=\"compass-kicker\">03 \u00b7 \uc54c\ud2b8 \uc21c\ud658\ub9e4\u003c/div>\u003cb id=\"compassAlt\">\uae30\uc874 \ub808\uc774\ub354 \uc5f0\ub3d9 \ub300\uae30\u003c/b>\u003cdiv class=\"compass-desc\" id=\"compassAltDesc\">ALTSEASON SCORE \ubc0f BTC \ub300\ube44 \uc0c1\ub300\uac15\ub3c4\u003c/div>\u003c/article>\n    \u003carticle class=\"compass-card\">\u003cdiv class=\"compass-kicker\">04 \u00b7 \uc2dc\uc7a5 \uacfc\uc5f4\u003c/div>\u003cb id=\"compassHeat\">\u2014\u003c/b>\u003cdiv class=\"compass-desc\" id=\"compassHeatDesc\">\uc885\ud569 \uacfc\uc5f4 \uc810\uc218 \uae30\uc900\u003c/div>\u003c/article>\n  \u003c/div>\n  \u003cdiv class=\"compass-grid\" id=\"compassGrid2\">\n    \u003carticle class=\"compass-card\">\u003cdiv class=\"compass-kicker\">05 \u00b7 \uc11c\ud3ec\ud2b8 \ub300\ube44 \uc704\uce58\u003c/div>\u003cb id=\"compassAhead\">\u2014\u003c/b>\u003cdiv class=\"compass-desc\" id=\"compassAheadDesc\">5% \ubd84\uc704\ud68c\uadc0 \uc11c\ud3ec\ud2b8 \uace1\uc120 \uae30\uc900\u003c/div>\u003c/article>\n    \u003carticle class=\"compass-card\">\u003cdiv class=\"compass-kicker\">06 \u00b7 Mayer \u00b7 200\uc8fc\uc120\u003c/div>\u003cb id=\"compassMayer\">\u2014\u003c/b>\u003cdiv class=\"compass-desc\" id=\"compassMayerDesc\">200\uc77c \ud3c9\uade0 \ub300\ube44 \u00b7 200\uc8fc \ud3c9\uade0 \ub300\ube44\u003c/div>\u003c/article>\n    \u003carticle class=\"compass-card\">\u003cdiv class=\"compass-kicker\">07 \u00b7 \ubc18\uac10\uae30 \uc0ac\uc774\ud074 \uc2dc\uacc4\u003c/div>\u003cb id=\"compassCycle\">\u2014\u003c/b>\u003cdiv class=\"compass-desc\" id=\"compassCycleDesc\">\uc5ed\ub300 \uace0\uc810\u00b7\uc800\uc810 \ud0c0\uc774\ubc0d\uacfc \ube44\uad50\u003c/div>\u003c/article>\n    \u003carticle class=\"compass-card\">\u003cdiv class=\"compass-kicker\">08 \u00b7 \uc885\ud569 \uacfc\uc5f4 \uc810\uc218\u003c/div>\u003cb id=\"compassHeatScore\">\u2014\u003c/b>\u003cdiv class=\"compass-desc\" id=\"compassHeatParts\">\ubc34\ub4dc\u00b7Z-score\u00b7Mayer\u00b7\uc11c\ud3ec\ud2b8 \uc55e\uc120 \ub144\uc218\u00b7\ubcc0\ub3d9\uc131 \ubcf4\uc815 \ud3c9\uade0\u003c/div>\u003c/article>\n  \u003c/div>\n  \u003cdiv class=\"compass-grid\" id=\"compassGrid3\" style=\"grid-template-columns:repeat(2,minmax(0,1fr))\">\n    \u003carticle class=\"compass-card\">\u003cdiv class=\"compass-kicker\">09 \u00b7 \ubcc0\ub3d9\uc131 \ubcf4\uc815 \uc9c0\uc218\u003c/div>\u003cb id=\"compassVol\">\u2014\u003c/b>\u003cdiv class=\"compass-desc\" id=\"compassVolDesc\">\uc911\uc559\uc120 \uad34\ub9ac \u00f7 \ucd5c\uadfc 36\uac1c\uc6d4 \ubcc0\ub3d9\ud3ed\u003c/div>\u003c/article>\n    \u003carticle class=\"compass-card\">\u003cdiv class=\"compass-kicker\">10 \u00b7 \uc54c\ud2b8 \uc6b4\uc6a9 \uac00\uc774\ub4dc (\uaddc\uce59 \uae30\ubc18)\u003c/div>\u003cb id=\"compassAltGuide\">\u2014\u003c/b>\u003cdiv class=\"compass-desc\" id=\"compassAltChecks\">\uc870\uac74 \ud655\uc778 \uc911\u2026\u003c/div>\u003c/article>\n  \u003c/div>\n  \u003cdiv class=\"compass-metrics\" id=\"compassMetrics\">\u003cspan>BTC \ud604\uc7ac\uac00 \u2014\u003c/span>\u003cspan>4Y CAGR \u2014\u003c/span>\u003cspan>4Y Z-score \u2014\u003c/span>\u003cspan>\uc7a5\uae30 \ubc34\ub4dc \uc704\uce58 \u2014\u003c/span>\u003c/div>\n  \u003ccanvas id=\"compassChart\" class=\"compass-chart\" aria-label=\"BTC \uc7a5\uae30 \uac00\uaca9 \ubc0f \ud68c\uadc0 \ubc34\ub4dc \ucc28\ud2b8\">\u003c/canvas>\n  \u003cdiv class=\"compass-legend\">\u003cspan>\u003ci class=\"cc-price\">\u003c/i> BTC \uc6d4\ubd09\u003c/span>\u003cspan>\u003ci class=\"cc-model\">\u003c/i> \ud68c\uadc0 \uc911\uc559\uc120\u003c/span>\u003cspan>\u003ci class=\"cc-band\">\u003c/i> 5%(\uc11c\ud3ec\ud2b8)~95% \ubc34\ub4dc\u003c/span>\u003c/div>\n  \u003cdiv class=\"compass-verdict\" id=\"compassVerdict\">\ub370\uc774\ud130 \uc5f0\uacb0 \ud6c4 4\ub2e8\uacc4 \ud310\ub2e8\uc744 \uc885\ud569\ud569\ub2c8\ub2e4.\u003c/div>\n\n  \u003csection class=\"rotation-engine\" id=\"capitalRotationEngine\">\n    \u003cdiv class=\"rotation-head\">\u003cdiv>\u003cb>\ud83c\udf10 GLOBAL CAPITAL ROTATION ENGINE\u003c/b>\u003cdiv class=\"small\" id=\"rotationStatus\">AI\u00b7\ubc18\ub3c4\uccb4 \u2192 \ucc44\uad8c\u00b7\ud604\uae08 \u2192 BTC\u00b7ETH \u2192 \uc54c\ud2b8\ucf54\uc778 \uc21c\ud658 \uc5ec\ubd80 \ud655\uc778 \uc911\u2026\u003c/div>\u003c/div>\u003cbutton type=\"button\" class=\"btn\" id=\"rotationReload\">\uc790\uae08\uc21c\ud658 \ub370\uc774\ud130 \uc0c8\ub85c\uace0\uce68\u003c/button>\u003c/div>\n    \u003cdiv class=\"rotation-flow\" id=\"rotationVerdict\">\u003cspan>\uc2e4\uc81c \uc790\uae08 \uc774\ub3d9 \uc5ec\ubd80\ub97c \ub370\uc774\ud130\ub85c \uac80\uc99d\ud569\ub2c8\ub2e4.\u003c/span>\u003c/div>\n    \u003cdiv class=\"rotation-grid\" id=\"rotationPhases\">\n      \u003cdiv class=\"rotation-phase\">\u003csmall>01 \u00b7 AI \u00b7 \ubc18\ub3c4\uccb4\u003c/small>\u003cb>\u2014\u003c/b>\u003cspan>\uac00\uaca9 \ubaa8\uba58\ud140 \ub370\uc774\ud130 \uc870\ud68c \uc911\u003c/span>\u003c/div>\n      \u003cdiv class=\"rotation-phase\">\u003csmall>02 \u00b7 \ucc44\uad8c \u00b7 \ud604\uae08\u003c/small>\u003cb>\u2014\u003c/b>\u003cspan>\uac00\uaca9 \ubaa8\uba58\ud140 \ub370\uc774\ud130 \uc870\ud68c \uc911\u003c/span>\u003c/div>\n      \u003cdiv class=\"rotation-phase\">\u003csmall>03 \u00b7 BTC \u00b7 ETH\u003c/small>\u003cb>\u2014\u003c/b>\u003cspan>ETF \uc21c\uc720\uc785 \ub370\uc774\ud130 \uc870\ud68c \uc911\u003c/span>\u003c/div>\n      \u003cdiv class=\"rotation-phase\">\u003csmall>04 \u00b7 \uc54c\ud2b8\ucf54\uc778\u003c/small>\u003cb>\u2014\u003c/b>\u003cspan>BTC \ub300\ube44 \uc0c1\ub300\uac15\ub3c4 \uc870\ud68c \uc911\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"rotation-table-wrap\" id=\"rotationAssets\">\uc790\uc0b0\ubcc4 7\uc77c\u00b730\uc77c\u00b790\uc77c \ub370\uc774\ud130\ub97c \ubd88\ub7ec\uc624\ub294 \uc911\u2026\u003c/div>\n    \u003cdiv class=\"rotation-table-wrap\" id=\"rotationFlows\">\u003c/div>\n    \u003cdiv class=\"rotation-note\" id=\"rotationNotes\">\uc8fc\uc758: \uac00\uaca9 \uc0c1\uc2b9\u00b7\ud558\ub77d\uc740 \uc790\uae08 \uc720\ucd9c\uc785\uacfc \ub3d9\uc77c\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uc9c1\uc811 \ud655\uc778\ub41c ETF \uc21c\uc720\uc785\uacfc \uac00\uaca9 \uae30\ubc18 proxy\ub97c \uad6c\ubd84\ud569\ub2c8\ub2e4.\u003c/div>\n\n\n\n  \u003cdiv class=\"compass-bt\" id=\"compassBt\" style=\"margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff\">\n    \u003cdiv style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center\">\u003cb style=\"font-size:15px\">\ud83d\udcca \uc790\ub3d9 \uc6cc\ud06c\ud3ec\uc6cc\ub4dc \ubc31\ud14c\uc2a4\ud2b8 \u003cspan class=\"small\" style=\"font-weight:500\">\uacfc\uc5f4 \uc810\uc218 \uad6c\uac04\ubcc4 \uc774\ud6c4 \uc218\uc775\ub960\u00b7\ucd5c\ub300\ub099\ud3ed\u003c/span>\u003c/b>\u003cbutton type=\"button\" class=\"btn\" id=\"compassBtReload\">\ubc31\ud14c\uc2a4\ud2b8 \ub2e4\uc2dc \uacc4\uc0b0\u003c/button>\u003c/div>\n    \u003cdiv class=\"small\" id=\"compassBtStatus\" style=\"margin-top:6px\">\ubc31\ud14c\uc2a4\ud2b8 \uacc4\uc0b0 \uc911\u2026 (\ucc98\uc74c 1\ud68c\ub294 \uc218 \ucd08 \uac78\ub9b4 \uc218 \uc788\uc2b5\ub2c8\ub2e4)\u003c/div>\n    \u003cdiv class=\"compass-verdict\" id=\"compassBtVerdict\" style=\"display:none\">\u003c/div>\n    \u003cdiv id=\"compassBtTable\" style=\"overflow-x:auto;margin-top:8px\">\u003c/div>\n    \u003cdiv class=\"small\" id=\"compassBtNotes\" style=\"margin-top:6px;line-height:1.55;color:var(--muted)\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"compass-cycles small\" id=\"compassCycles\" style=\"margin-top:10px;overflow-x:auto\">\u003c/div>\n  \u003cdiv class=\"small compass-foot\">\ubaa8\ub378 \uc124\uba85: 2011\ub144 \uc774\ud6c4 \uc644\ub8cc \uc6d4\ub9d0 \uc885\uac00\ub9cc\uc73c\ub85c \ub85c\uadf8-\ub85c\uadf8 \ubd84\uc704\ud68c\uadc0(5%\u00b750%\u00b795%)\ub97c \uc801\ud569\ud558\uace0, \uc9c4\ud589 \uc911\uc778 \ub2ec\uc740 \ud604\uc7ac\uac00 \ud3c9\uac00\uc5d0\ub9cc \uc0ac\uc6a9\ud569\ub2c8\ub2e4. 4Y Z-score\ub294 \uc9c1\uc804 48\uac1c \uc644\ub8cc \uc6d4\uc758 \ub85c\uadf8\uac00\uaca9 \ubd84\ud3ec\ub97c \uae30\uc900\uc73c\ub85c \ud604\uc7ac\uac00\ub97c \ube44\uad50\ud569\ub2c8\ub2e4. CAGR\u00b73\uac1c\uc6d4 \uc218\uc775\ub960\uc740 \uc77c\ubcc4 \uc790\ub8cc\uac00 \uc788\uc73c\uba74 1461\uc77c\u00b790\uc77c \uc804 \uad00\uce21\uac12\uc744 \uc0ac\uc6a9\ud558\uace0, \uc6d4\ubd09 \ud3f4\ubc31\uc5d0\uc11c\ub294 \uadfc\uc0ac\uce58\ub85c \ud45c\uc2dc\ud569\ub2c8\ub2e4. \uacfc\uc5f4 \uc810\uc218\ub294 5\uac1c \uad00\uc810 \uc911 \ucd5c\uc18c 4\uac1c\uac00 \uc720\ud6a8\ud560 \ub54c\ub9cc \uc0b0\ucd9c\ud569\ub2c8\ub2e4. \ub370\uc774\ud130 \uc2e0\uc120\ub3c4\u00b7\ud45c\ubcf8 \uac04\uaca9\u00b7\ud68c\uadc0 \uacbd\uacc4\uac12 \uac80\uc0ac\ub97c \ud1b5\uacfc\ud558\uc9c0 \ubabb\ud558\uba74 \uc885\ud569 \ub9e4\uc218\u00b7\ub9e4\ub3c4 \ud310\ub2e8\uc744 \ubcf4\ub958\ud569\ub2c8\ub2e4. \ud398\uc774\uc9c0\ub97c \uc5f4 \ub54c \uc790\ub3d9\uc73c\ub85c \uc6cc\ud06c\ud3ec\uc6cc\ub4dc \ubc31\ud14c\uc2a4\ud2b8(\ub9e4\uc6d4 \ub9d0 \uc2dc\uc810\uae4c\uc9c0\uc758 \ub370\uc774\ud130\ub9cc\uc73c\ub85c \uc7ac\uacc4\uc0b0)\ub97c \ubcf4\uc5ec\uc8fc\uc9c0\ub9cc, \uc810\uc218 \uad6c\uac04 \uacbd\uacc4\ub294 \uc0ac\ub78c\uc774 \uc815\ud55c \uac12\uc774\uace0 \ud45c\ubcf8\uc774 \uc801\uc5b4 \uc608\uce21\ub825\uc774 \uc785\uc99d\ub41c \uac83\uc740 \uc544\ub2d9\ub2c8\ub2e4. \uc810\uc218 \uad6c\uac04\uc774 \ubc14\ub00c\uc5b4\ub3c4 3\uc77c \uc5f0\uc18d \uc720\uc9c0\ub420 \ub54c\ub9cc \ud655\uc815 \uc2e0\ud638\uac00 \ubc14\ub01d\ub2c8\ub2e4(KV \uc5f0\uacb0 \uc2dc). \ud22c\uc790 \ud310\ub2e8 \ubcf4\uc870\uc6a9\uc774\uba70 \ub2e8\ub3c5 \ub9e4\ub9e4 \uc2e0\ud638\uac00 \uc544\ub2d9\ub2c8\ub2e4.\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"panel\">\n    \u003cdiv class=\"macro-strip\">\n  \u003cdiv class=\"metric card macro-card\">\n    \u003cdiv class=\"label\">BTC \ub3c4\ubbf8\ub10c\uc2a4\u003c/div>\u003cdiv class=\"value\" id=\"btcDom\">\u2014\u003c/div>\n    \u003cdiv class=\"small\" id=\"btcDomSub\">BTC \uc2dc\ucd1d \uc810\uc720\uc728\u003c/div>\n    \u003cdiv class=\"macro-context\" id=\"btcDomContext\">\uc7a5\uae30 \uc704\uce58 \uacc4\uc0b0 \uc911\u2026\u003c/div>\n    \u003ccanvas class=\"macro-spark macro-spark-lg\" id=\"btcDomChart\">\u003c/canvas>\n  \u003c/div>\n  \u003cdiv class=\"metric card macro-card\">\n    \u003cdiv class=\"label\">Mayer Multiple\u003c/div>\u003cdiv class=\"value\" id=\"mayer\">\u2014\u003c/div>\n    \u003cdiv class=\"small\" id=\"mayerSub\">BTC \u00f7 200\uc77c \uc774\ub3d9\ud3c9\uade0\u003c/div>\n    \u003cdiv class=\"macro-context\" id=\"mayerContext\">10\ub144 \uc5ed\uc0ac \uae30\uc900 \uacc4\uc0b0 \uc911\u2026\u003c/div>\n    \u003ccanvas class=\"macro-spark macro-spark-lg\" id=\"mayerChart\">\u003c/canvas>\n  \u003c/div>\n  \u003cdiv class=\"metric card macro-card\">\n    \u003cdiv class=\"label\">\uacf5\ud3ec\u00b7\ud0d0\uc695 \uc9c0\uc218\u003c/div>\u003cdiv class=\"value\" id=\"fearGreed\">\u2014\u003c/div>\n    \u003cdiv class=\"small\" id=\"fearGreedSub\">0 \uacf5\ud3ec \u00b7 100 \ud0d0\uc695\u003c/div>\n    \u003cdiv class=\"macro-context\" id=\"fearGreedContext\">\ucd5c\uadfc 30\uc77c \uc2ec\ub9ac \ucd94\uc774\u003c/div>\n    \u003ccanvas class=\"macro-spark macro-spark-lg\" id=\"fearGreedChart\">\u003c/canvas>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"controls\">\n      \u003cinput id=\"worker\" placeholder=\"Worker \uc790\ub3d9 \uc5f0\uacb0\ub428 \u00b7 \ud544\uc694\uc2dc \ubcc0\uacbd \uac00\ub2a5\">\n      \u003cinput id=\"pin\" type=\"password\" placeholder=\"Worker PIN\">\n      \u003cbutton class=\"btn primary\" id=\"save\">\uc124\uc815 \uc800\uc7a5\u003c/button>\n      \u003cbutton class=\"btn\" id=\"health\">\uc5f0\uacb0 \uc810\uac80\u003c/button>\n      \u003cbutton class=\"btn\" id=\"statusBtn\">Regime \uc7ac\ubd84\uc11d\u003c/button>\n      \u003cbutton class=\"btn\" id=\"scan\">\uc9c0\uae08 \uc870\ud68c(\uc54c\ub9bcX)\u003c/button>\n      \u003cbutton class=\"btn\" id=\"test\">Telegram \ud14c\uc2a4\ud2b8\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"small\" style=\"margin-top:7px\">\ud604\uc7ac \ud654\uba74\uc758 Regime\uc740 \ube0c\ub77c\uc6b0\uc800\uc5d0\uc11c \uc2e4\uc2dc\uac04 \uacc4\uc0b0\ud569\ub2c8\ub2e4. \u300cRegime \uc7ac\ubd84\uc11d\u300d/\u300c\uc9c0\uae08 \uc870\ud68c\u300d\ub294 Telegram\uc744 \ubc1c\uc1a1\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. Cloudflare Cron \uc790\ub3d9\uac10\uc2dc\ub294 \ubcc4\ub3c4 \ubc31\uc5d4\ub4dc \ubcf5\uad6c \ub300\uc0c1\uc785\ub2c8\ub2e4.\u003c/div>\n  \u003c/div>\n\n\n  \u003cdiv class=\"regime-layout\">\n    \u003csection class=\"panel regime-panel\">\n      \u003cdiv class=\"regime-title\">\ud83d\udcca BTC-ALT Regime Engine \u003cspan>(\uc2e4\uc2dc\uac04 \ubd84\uc11d)\u003c/span>\u003c/div>\n\n      \u003cdiv class=\"regime-top\">\n        \u003cdiv class=\"regime-card\">\n          \u003cdiv class=\"regime-label\">BTC Regime\u003c/div>\n          \u003cdiv id=\"engineBtcState\" class=\"regime-state\">\u2014\u003c/div>\n          \u003cdiv id=\"engineBtcStrength\" class=\"regime-small\">\ucd94\uc138 \uac15\ub3c4: \u2014\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"regime-card\">\n          \u003cdiv class=\"regime-label\">ALT Regime\u003c/div>\n          \u003cdiv id=\"engineAltState\" class=\"regime-state\">\u2014\u003c/div>\n          \u003cdiv id=\"engineAltStrength\" class=\"regime-small\">\ucd94\uc138 \uac15\ub3c4: \u2014\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"regime-card\">\n          \u003cdiv class=\"regime-label\">\uc2dc\uc7a5 \uc13c\ud2f0\uba3c\ud2b8\u003c/div>\n          \u003cdiv id=\"engineSentiment\" class=\"regime-state\">\u2014\u003c/div>\n          \u003cdiv id=\"engineSentimentSmall\" class=\"regime-small\">\uc2dc\uc7a5 \ubaa8\uba58\ud140: \u2014\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"regime-card top3-card\">\n          \u003cdiv class=\"regime-label\">\ud83c\udfc6 \uc624\ub298\uc758 \uac15\uc138 TOP 3\u003c/div>\n          \u003cdiv id=\"engineTop3\" class=\"top3-list\">\u2014\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"engine-indicators\">\n        \u003cdiv class=\"indicator-card\">\u003cdiv>Relative Strength\u003c/div>\u003cb id=\"engineRS\">\u2014\u003c/b>\u003c/div>\n        \u003cdiv class=\"indicator-card\">\u003cdiv>Absolute Momentum\u003c/div>\u003cb id=\"engineAM\">\u2014\u003c/b>\u003c/div>\n        \u003cdiv class=\"indicator-card\">\u003cdiv>Fibonacci Confluence\u003c/div>\u003cb id=\"engineFib\">\u2014\u003c/b>\u003c/div>\n        \u003cdiv class=\"indicator-card\">\u003cdiv>Alt Season Radar\u003c/div>\u003cb id=\"engineRadar\">\u2014\u003c/b>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"regime-section-head\">\n        \u003cb>\ucd94\ucc9c \ub9e4\ub9e4 \uc2e0\ud638\u003c/b>\n        \u003cspan class=\"small\">\ud604\uc7ac \uc870\uac74\uc774 \ub9de\ub294 \uc885\ubaa9\uc744 \uc704\ucabd\ubd80\ud130 \ud45c\uc2dc \u00b7 \uc2e4\uc81c \ub9e4\ub9e4\ub294 \uc218\ub3d9\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"regime-table-wrap\">\n        \u003ctable class=\"regime-table\">\n          \u003cthead>\n            \u003ctr>\n              \u003cth>\ucf54\uc778\u003c/th>\u003cth>\uc885\ubaa9\uba85\u003c/th>\u003cth>\uc2e0\ud638 / \uadfc\uac70\u003c/th>\u003cth>\ubaa9\ud45c\uac00(1/2/3)\u003c/th>\u003cth>\uc190\uc808\u003c/th>\n            \u003c/tr>\n          \u003c/thead>\n          \u003ctbody id=\"engineRows\">\n            \u003ctr>\u003ctd colspan=\"5\" class=\"small\">\uc2e0\ud638 \ub300\uae30\uc911\u2026\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"panel rot-panel\" id=\"rotPanel\">\n      \u003cdiv class=\"rs-title\">\ud83d\udd04 \uc21c\ud658\ub9e4 \ub808\uc774\ub354 \u00b7 BTC \ub300\ube44 \uc790\uae08 \uc774\ub3d9 \u003cspan>(\ucd94\uc138\uc640 \uc21c\ud658\ub9e4\ub97c \ubd84\ub9ac\ud574\uc11c \ubd05\ub2c8\ub2e4)\u003c/span>\u003cspan class=\"live-dot\" id=\"rotLive\">\u25cf \ub300\uae30\u003c/span>\u003c/div>\n      \u003cdiv class=\"small rot-note\">\uac15\ud55c \ucf54\uc778\uc774 \uacc4\uc18d \uc624\ub974\uba74 \ucd94\uc138 \uc810\uc218\ub97c \uc720\uc9c0\ud558\uace0, \ud6c4\ubc1c \ucf54\uc778\uc758 \uc0c1\ub300\uac15\ub3c4\u00b7\uac70\ub798\ub7c9 \uc810\uc720\uc728\uc774 \ud568\uaed8 \uc62c\ub77c\uc62c \ub54c\ub9cc \uc21c\ud658\ub9e4 \uc720\uc785\uc73c\ub85c \ud45c\uc2dc\ud569\ub2c8\ub2e4. \ub9e4\uc218/\ub9e4\ub3c4 \uc2e0\ud638\uac00 \uc544\ub2c8\ub77c \uc218\ub3d9 \ud310\ub2e8\uc6a9 \uad00\ucc30 \uc2e0\ud638\uc774\uba70, Worker\uc758 BUY/SELL \ub85c\uc9c1\uc5d0\ub294 \uc601\ud5a5\uc744 \uc8fc\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.\u003c/div>\n      \u003cdiv class=\"rot-verdict\" id=\"rotVerdict\">\u003cb>\ub370\uc774\ud130 \uc218\uc9d1\uc911\u2026\u003c/b>\u003cdiv class=\"small\">BTC\uc640 \ub4f1\ub85d\ub41c \ucf54\uc778\uc758 5\ubd84\u00b71\uc2dc\uac04 \uce94\ub4e4\uc744 \ubd88\ub7ec\uc624\ub294 \uc911\uc785\ub2c8\ub2e4. \ucf54\uc778 \uc218\uc5d0 \ub530\ub77c 10~30\ucd08 \uac78\ub9b4 \uc218 \uc788\uc2b5\ub2c8\ub2e4.\u003c/div>\u003c/div>\n      \u003cdiv class=\"rot-bar\">\n        \u003cbutton id=\"rotRefreshBtn\" type=\"button\">\uc21c\ud658\ub9e4 \uc0c8\ub85c\uace0\uce68\u003c/button>\n        \u003cbutton type=\"button\" data-rot-sort=\"state\" class=\"on\">\ud310\uc815\uc21c\u003c/button>\n        \u003cbutton type=\"button\" data-rot-sort=\"trend\">\ucd94\uc138\uc21c\u003c/button>\n        \u003cbutton type=\"button\" data-rot-sort=\"rot\">\uc21c\ud658\ub9e4\uc21c\u003c/button>\n        \u003cspan class=\"rot-gap\">\u003c/span>\n        \u003cspan class=\"small\" id=\"rotStatus\">\u2014\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"rot-add\">\n        \u003cinput id=\"rotAddInput\" list=\"rotCoinList\" placeholder=\"\ucd94\uac00\ud560 \ucf54\uc778 \uc2ec\ubcfc (\uc608: SOL, DOGE)\" autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\">\n        \u003cdatalist id=\"rotCoinList\">\u003c/datalist>\n        \u003cbutton id=\"rotAddBtn\" type=\"button\">\ucf54\uc778 \ucd94\uac00\u003c/button>\n        \u003cbutton id=\"rotResetBtn\" type=\"button\">\uae30\ubcf8 10\uac1c\ub85c\u003c/button>\n        \u003cspan class=\"small\">\ub4f1\ub85d \u003cb id=\"rotCoinCount\">\u2014\u003c/b> \u00b7 \ud589\uc758 \u00d7\ub85c \uc0ad\uc81c \u00b7 \uc5c5\ube44\ud2b8 \uc6d0\ud654\ub9c8\ucf13 \ucf54\uc778\ub9cc \uac00\ub2a5\u003c/span>\n        \u003cspan class=\"small\" id=\"rotAddMsg\">\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"rot-error\" id=\"rotError\" hidden>\u003c/div>\n      \u003cdiv class=\"rot-btc\" id=\"rotBtc\">\u003c/div>\n      \u003cdiv class=\"regime-table-wrap\">\n        \u003ctable class=\"rot-table\">\n          \u003cthead>\u003ctr>\u003cth>\ucf54\uc778\u003c/th>\u003cth>\ucd94\uc138\u003c/th>\u003cth>\uc21c\ud658\ub9e4\u003c/th>\u003cth>1\uc2dc\uac04 BTC\ub300\ube44\u003c/th>\u003cth>4\uc2dc\uac04 BTC\ub300\ube44\u003c/th>\u003cth>24\uc2dc\uac04 BTC\ub300\ube44\u003c/th>\u003cth>5\ubd84 BTC\uc0c1\ud68c\u003c/th>\u003cth>\uac70\ub798\ub7c9 \uc810\uc720\uc728\u003c/th>\u003cth>\ud310\uc815\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody id=\"rotBody\">\u003ctr>\u003ctd colspan=\"9\" class=\"small\" style=\"text-align:center;padding:16px\">\uc218\uc9d1\uc911\u2026\u003c/td>\u003c/tr>\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      \u003cdiv class=\"small rot-foot\">\ucd94\uc801\uad70 \uac70\ub798\ub7c9 \uc810\uc720\uc728 = \ub808\uc774\ub354\uc5d0 \ub4f1\ub85d\ub41c \u003cspan data-rot-count>10\u003c/span>\uac1c \ucf54\uc778 \uc0ac\uc774\uc758 \uc0c1\ub300 \ube44\uc911\uc785\ub2c8\ub2e4(\uc804\uccb4 \uc2dc\uc7a5 \uc810\uc720\uc728 \uc544\ub2d8, BTC \uc81c\uc678). \ucf54\uc778\uc744 \ucd94\uac00\u00b7\uc0ad\uc81c\ud558\uba74 \uc810\uc720\uc728 \ubd84\ubaa8\uac00 \ubc14\ub00c\uc5b4 \uc218\uce58\uac00 \ud568\uaed8 \ub2ec\ub77c\uc9d1\ub2c8\ub2e4. \uad04\ud638 \uc548 \uc218\uce58\ub294 \ucd5c\uadfc 24\uc2dc\uac04 \uc2dc\uac04\ub2f9 \ud3c9\uade0 \ub300\ube44 \ubcc0\ud654(%p)\uc785\ub2c8\ub2e4. \uc810\uc218 \ud750\ub984(94\u219296\u219298)\uc740 \uc774 \ube0c\ub77c\uc6b0\uc800\uac00 \uc5f4\ub824 \uc788\ub294 \ub3d9\uc548 5\ubd84\ub9c8\ub2e4 \uae30\ub85d\ub429\ub2c8\ub2e4.\u003c/div>\n      \u003cdetails class=\"rot-details\">\u003csummary>\uc810\uc218\uc640 \ud310\uc815 \uae30\uc900\u003c/summary>\n        \u003cul>\n          \u003cli>\ucd94\uc138 \uc810\uc218 = 24h\u00b74h\u00b71h BTC \ub300\ube44 \uc0c1\ub300\uac15\ub3c4, 5\ubd84\ubd09 BTC \uc0c1\ud68c \ud69f\uc218, 24h \uc808\ub300 \uc0c1\uc2b9\ub960\uc744 \ud569\uc0b0. \ucf54\uc778\uc774 \uacc4\uc18d \uc624\ub974\uba74 \uc720\uc9c0\ub429\ub2c8\ub2e4.\u003c/li>\n          \u003cli>\uc21c\ud658\ub9e4 \uc810\uc218 = \ucd5c\uadfc 1\uc2dc\uac04 \uc0c1\ub300\uac15\ub3c4\uc758 \uac00\uc18d, \uac70\ub798\ub7c9 \uc810\uc720\uc728 \uc99d\uac00, \uac70\ub798\ub7c9 \uae09\uc99d, 5\ubd84\ubd09 BTC \uc0c1\ud68c \ud69f\uc218\ub97c \ud569\uc0b0.\u003c/li>\n          \u003cli>\uc21c\ud658\ub9e4 \uc720\uc785: \uc21c\ud658\ub9e4 65\uc810 \uc774\uc0c1, 1h \uc0c1\ub300\uac15\ub3c4 \ud50c\ub7ec\uc2a4, 5\ubd84 BTC \uc0c1\ud68c 8/12 \uc774\uc0c1, \uc810\uc720\uc728 \uc99d\uac00, \ucd94\uc138 80 \ubbf8\ub9cc(\ud6c4\ubc1c).\u003c/li>\n          \u003cli>\uc774\ud0c8 \uacbd\uace0: \ucd94\uc138 60 \uc774\uc0c1\uc774\ub358 \ucf54\uc778\uc774 1h \uc0c1\ub300\uac15\ub3c4\uac00 \uaebe\uc774\uace0 \uc810\uc720\uc728\uc774 \uc904 \u ut type=\"checkbox\" id=\"rsShow19\" checked title=\"\ucc28\ud2b8 \ud45c\uc2dc/\uc228\uae40\">\u003cselect id=\"rsCoin19\">\u003c/select>\u003c/div>\n        \u003cdiv class=\"rs-slot\">\u003cinput type=\"checkbox\" id=\"rsShow20\" checked title=\"\ucc28\ud2b8 \ud45c\uc2dc/\uc228\uae40\">\u003cselect id=\"rsCoin20\">\u003c/select>\u003c/div>\n      \u003c/div>\u003cdiv class=\"rs-toolbar\">\u003cbutton id=\"rsShowAll\">\uc804\uccb4 \ud45c\uc2dc\u003c/button>\u003cbutton id=\"rsHideAll\">\uc804\uccb4 \uc228\uae40\u003c/button>\u003c/div>\n      \u003cdiv class=\"small rs-note\">20\uac1c \ucf54\uc778\uae4c\uc9c0 \uc120\ud0dd \uac00\ub2a5 \u00b7 \uccb4\ud06c\ud55c \ucf54\uc778\ub9cc \ud45c\uc2dc \u00b7 \uccab \uc2dc\uc810 = 100 \u00b7 \uac01 \ucf54\uc778\uc758 \ucd5c\uadfc 5\ubd84 \uc218\uc775\ub960 \ud750\ub984\uc744 BTC\uc640 \uac19\uc740 \uae30\uc900\uc73c\ub85c \ube44\uad50\ud569\ub2c8\ub2e4.\u003c/div>\n      \u003cdiv class=\"rs-legend\" id=\"rsLegend\">\u003c/div>\n      \u003ccanvas id=\"rsChart\" class=\"rs-chart\" aria-label=\"BTC/ALT \ucd5c\uadfc 5\ubd84 \uc0c1\ub300\uac15\ub3c4 \ucc28\ud2b8\">\u003c/canvas>\n    \u003c/section>\n  \u003c/div>\n\u003c/main>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst VERSION='v10.15.0-ta-signal-lab';\nconst COINS=['ETH','SOL','XRP','HBAR','ONDO','LINK','AVAX','DOGE','SUI','TAO','UNI','AAVE'];\nconst FIVE_MIN=5*60*1000,FIFTEEN_MIN=15*60*1000,DAY_MS=24*60*60*1000;\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,m=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]));\nconst W=$('worker'),P=$('pin');\n// \uacf5\uac1c \ubc30\ud3ec\uc6a9: \ucc98\uc74c \ubc29\ubb38\ud55c \uc0ac\uc6a9\uc790\ub3c4 \ubcc4\ub3c4 \uc124\uc815 \uc5c6\uc774 \uc2e4\uc2dc\uac04 \ub370\uc774\ud130\uc5d0 \uc5f0\uacb0\ub429\ub2c8\ub2e4.\nconst DEFAULT_WORKER='https://btc-alt-scalper-v7.suby716.workers.dev';\nW.value=localStorage.getItem('v8_worker')||localStorage.getItem('v7_worker')||DEFAULT_WORKER;\nP.value=localStorage.getItem('v8_pin')||localStorage.getItem('v7_pin')||'';\nlet SERVER_CFG={minScore:75,tp1Pct:1.2,tp2Pct:2.2,stopLossPct:.8,patternConfirmation:true,patternBuyMinScore:2,patternSellScore:-4,regimeEngine:true,tradingFeePct:.05};\nlet LAST={};\nlet LEDGER={positions:{},open:[],history:[],summary:{}};\nlet LATEST_ROWS={};\nconst HISTORY_CACHE=new Map();\nlet DAILY_BTC_CACHE=[];\n\nfunction money(x){if(x==null||!Number.isFinite(Number(x)))return'\u2014';const n=Number(x);return n>=1000?'\u20a9'+n.toLocaleString('ko-KR',{maximumFractionDigits:0}):'\u20a9'+n.toLocaleString('ko-KR',{maximumFractionDigits:6})}\nfunction fmtNum(x,n=2){return x==null||!Number.isFinite(Number(x))?'\u2014':Number(x).toFixed(n)}\nfunction pctFmt(x){return x==null||!Number.isFinite(Number(x))?'\u2014':(Number(x)>=0?'+':'')+Number(x).toFixed(2)+'%'}\nfunction kst(ms){if(!Number.isFinite(Number(ms)))return'\u2014';return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(Number(ms)))}\nfunction log(msg){\n  const el=$('log');\n  if(el) el.textContent=String(msg??'');\n}\n\nfunction workerBase(){\n  const w=(W?.value||'').trim();\n  if(!w) throw Error('Worker URL\uc744 \uc785\ub825\ud558\uc138\uc694.');\n  if(!/^https:\\/\\//i.test(w)) throw Error('Worker URL\uc740 https:// \ub85c \uc2dc\uc791\ud574\uc57c \ud569\ub2c8\ub2e4.');\n  return w.replace(/\\/+$/,'');\n}\nasync function parseResponse(r){\n  const text=await r.text();\n  let d={};\n  try{ d=text?JSON.parse(text):{}; }\n  catch{\n    const head=text.replace(/\\s+/g,' ').slice(0,140);\n    throw Error(`Worker\uac00 JSON\uc774 \uc544\ub2cc \uc751\ub2f5\uc744 \ubcf4\ub0c8\uc2b5\ub2c8\ub2e4. HTTP ${r.status} \u00b7 ${head||'\ube48 \uc751\ub2f5'}`);\n  }\n  if(!r.ok) throw Error(d.error||`Worker \uc694\uccad \uc2e4\ud328 (HTTP ${r.status})`);\n  return d;\n}\nasync function fetchWithTimeout(url, options={}, timeoutMs=12000){\n  const ctrl=new AbortController();\n  const t=setTimeout(()=>ctrl.abort(),timeoutMs);\n  try{\n    return await fetch(url,{cache:'no-store',...options,signal:ctrl.signal});\n  }catch(e){\n    if(e?.name==='AbortError') throw Error(`Worker \uc751\ub2f5 \uc2dc\uac04\ucd08\uacfc (${Math.round(timeoutMs/1000)}\ucd08)`);\n    throw e;\n  }finally{ clearTimeout(t); }\n}\nasync function health(){\n  const r=await fetchWithTimeout(workerBase()+'/health',{method:'GET'},12000);\n  return parseResponse(r);\n}\nasync function call(path,body,ms=20000){\n  const headers={'x-scalper-pin':(P?.value||'').trim()};\n  if(body) headers['content-type']='application/json';\n  const url=workerBase()+path;\n  const r=await fetchWithTimeout(url,{\n    method:'POST',\n    headers,\n    body:body?JSON.stringify(body):undefined\n  },ms);\n  const text=await r.text();\n  let d={};\n  try{ d=text?JSON.parse(text):{}; }\n  catch{\n    const head=text.replace(/\\s+/g,' ').slice(0,180);\n    throw Error(`${path} HTTP ${r.status} \u00b7 JSON \uc544\ub2d8 \u00b7 ${head||'\ube48 \uc751\ub2f5'}`);\n  }\n  if(!r.ok){\n    const detail=[d.error,d.status!=null?`upstream ${d.status}`:''].filter(Boolean).join(' \u00b7 ');\n    throw Error(`${path} HTTP ${r.status}${detail?' \u00b7 '+detail:''}`);\n  }\n  return d;\n}\nfunction applyConfig(d){\n  if(d?.strategy) SERVER_CFG={...SERVER_CFG,...d.strategy};\n}\n\nfunction renderHealth(d){\n  // \ucd5c\uc18c \uad6c\uc870 \ub2e8\uacc4: #quality, #healthNote \uac19\uc740 \uc0c1\uc138 \ud328\ub110 \uc694\uc18c\uac00 \ud654\uba74\uc5d0 \uc5c6\uc744 \uc218 \uc788\uc73c\ubbc0\ub85c\n  // \uc635\uc154\ub110 \uccb4\uc774\ub2dd\uc73c\ub85c \uc548\uc804\ud558\uac8c \uac74\ub108\ub6f4\ub2e4 (\uc5c6\uc73c\uba74 \uadf8\ub0e5 \uc2a4\ud0b5, \uc5d0\ub7ec\ub85c \uc8fd\uc9c0 \uc54a\uc74c).\n  try{ applyConfig(d); }catch(e){ console.warn('applyConfig skip:', e.message); }\n  const q=$('quality');\n  if(q) q.innerHTML=`\u003cb>${esc(d.version||'\u2014')}\u003c/b> \u00b7 ${esc(d.market||'\u2014')} \u00b7 Worker \uc751\ub2f5 \uc815\uc0c1 \u00b7 PIN: \u003cb class=\"${d.pinConfigured?'good':'bad'}\">${d.pinConfigured?'\uc124\uc815\ub428':'\uc5c6\uc74c'}\u003c/b>`;\n  const note=$('healthNote');\n  if(note){ note.className='note ok'; note.textContent='Worker(/health)\uac00 \uc815\uc0c1 \uc751\ub2f5\ud588\uc2b5\ub2c8\ub2e4.'; }\n}\n\nfunction regimeText(state){\n  const m={\n    STRONG_BULL:'\uc0c1\uc2b9\uc7a5',BULL:'\uc0c1\uc2b9\uc7a5',RANGE:'\uc911\ub9bd',\n    BEAR:'\ud558\ub77d\uc7a5',CRASH:'\uae09\ub77d\uc7a5',\n    BROAD_RALLY:'\uc0c1\uc2b9\uc7a5',ROTATION:'\uc21c\ud658\ub9e4',UNKNOWN:'\uc911\ub9bd'\n  };\n  return m[state]||state||'\u2014';\n}\nfunction stateStrength(obj){\n  const n=Number(obj?.score);\n  return Number.isFinite(n)?Math.round(Math.max(0,Math.min(100,Math.abs(n)))):'\u2014';\n}\nfunction engineSignalReason(x){\n  const reasons=[...(x.reasons||[]),...(x.patternReasons||[])];\n  const compact=reasons.slice(0,2).join(' \u00b7 ');\n  if(compact) return compact;\n  if(x.signal==='BUY') return '\uc870\uac74 \ucda9\uc871';\n  if(x.signal==='WATCH') return '\ucd94\uac00 \ud655\uc778 \ud544\uc694';\n  return x.error||'\ub300\uae30';\n}\nfunction renderRegimeEngine(d){\n  const r=(d.results||[]).filter(x=>x&&x.symbol);\n  const mr=d.marketRegime||{};\n  const ar=d.altRegime||{};\n  const valid=r.filter(x=>Number.isFinite(Number(x.adjustedScore??x.score)));\n  const avg=(arr,fn)=>{\n    const v=arr.map(fn).filter(Number.isFinite);\n    return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;\n  };\n  const clamp100=x=>Math.max(0,Math.min(100,x));\n\n  // Relative Strength:\n  // BTC \ub300\ube44 RSI \ucc28\uc774(relR) + \ucd5c\uadfc 5\ubd84 \uc0c1\ub300\uc218\uc775\ub960(relRet)\uc744 \ud569\uc131.\n  const relRMean=avg(valid,x=>Number(x.relR));\n  const relRetMean=avg(valid,x=>Number(x.relRet));\n  const relScore=(relRMean==null||relRetMean==null)?null:\n    clamp100(50 + relRMean*1.8 + relRetMean*8);\n\n  // Absolute Momentum >Number(b[1].change24)-Number(a[1].change24))\n    .slice(0,3);\n  $('engineTop3').innerHTML=top3.length\n    ? top3.map(([sym,x],i)=>`\u003cdiv>\u003cb>${i+1}. ${sym}\u003c/b> \u003cspan class=\"${marketCls(x.change24)}\">${marketPct(x.change24)}\u003c/span>\u003c/div>`).join('')\n    : '\u003cspan class=\"small\">\uc2dc\uc7a5 \ub370\uc774\ud130 \ub300\uae30\uc911\u2026\u003c/span>';\n\n  // \ud56d\uc0c1 \ucd5c\ub300 5\uac1c\ub97c \ubcf4\uc5ec\uc900\ub2e4. BUY/WATCH\ub9cc \ud544\ud130\ub9c1\ud558\uc9c0 \uc54a\uace0,\n  // \uc2dc\uc7a5 \uc0c1\ud0dc\uc640 \uc0c1\ub300\uac15\ub3c4\ub97c \uc774\uc6a9\ud574 BUY / WATCH / SELL\uc744 \ubaa8\ub450 \ubd84\ub958\ud55c\ub2e4.\n  const classify=x=>{\n    const sc=Number(x.adjustedScore??x.score)||0;\n    const rel=Number(x.relRet)||0;\n    const rr=Number(x.relR)||0;\n    const bearish=!!x.patternBearish || Number(x.patternScore)\u003c=-3;\n    if(x.buy || (sc>=60 && rel>0 && rr>0 && !bearish && x.regime==='RISK_ON')) return 'BUY';\n    if(bearish || (sc\u003c=25 && rel\u003c0 && rr\u003c0) || (x.regime==='RISK_OFF' && rel\u003c-.15)) return 'SELL';\n    return 'WATCH';\n  };\n  const ranked=valid.map(x=>{\n    const signal=classify(x);\n    const sc=Number(x.adjustedScore??x.score)||0;\n    const rel=Math.abs(Number(x.relRet)||0);\n    const action=signal==='BUY'?100+sc:signal==='SELL'?100+(100-sc):50+rel*10;\n    return {...x,displaySignal:signal,actionRank:action};\n  }).sort((a,b)=>b.actionRank-a.actionRank).slice(0,5);\n\n  $('engineRows').innerHTML=ranked.length?ranked.map(x=>{\n    const p=Number(x.price),tp1=Number(x.tp1),tp2=Number(x.tp2);\n    const tp3=Number(x.fibonacciTp1618);\n    const sl=Number(x.sl);\n    const sig=x.displaySignal==='BUY'?'\ub9e4\uc218':x.displaySignal==='SELL'?'\ub9e4\ub3c4':'\uad00\ub9dd';\n    const cls=x.displaySignal==='BUY'?'buy':x.displaySignal==='SELL'?'sell':'watch';\n    const reason=x.displaySignal==='SELL'\n      ? ([x.patternBearish?'\ud558\ub77d \ud328\ud134':'',Number(x.relRet)\
