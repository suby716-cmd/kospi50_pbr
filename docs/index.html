14',q.n?(q.pf===Infinity?'\u221e':q.pf.toFixed(2)):'\u2014',q.n?q.mdd.toFixed(2)+'%':'\u2014',q.n?q.net.toFixed(2)+'%':'\u2014']}));\n  $('btScoreStats').innerHTML='\u003ch3>Score \uad6c\uac04 \u00b7 \ud3ec\ud2b8\ud3f4\ub9ac\uc624 1\ud3ec\uc9c0\uc158 \uae30\uc900\u003c/h3>'+table(['\uad6c\uac04','\uac70\ub798','\uc2b9\ub960','\uae30\ub300\uac12','PF'],[[75,80],[80,85],[85,90],[90,100.0001]].map(([a,b],i)=>{const q=stats(all.filter(x=>x.score>=a&&x.score\u003cb));const label=i\u003c3?`${a}-${b-1}`:'90-100';return[label,q.n,q.n?q.win.toFixed(1)+'%':'\u2014',q.n?q.avg.toFixed(3)+'%':'\u2014',q.n?(q.pf===Infinity?'\u221e':q.pf.toFixed(2)):'\u2014']}));\n  $('btTimeStats').innerHTML='\u003ch3>\uc2dc\uac04\ub300(KST)\u003c/h3>'+table(['KST','\uac70\ub798','\uc2b9\ub960','\uae30\ub300\uac12'],group(all,x=>String((new Date(x.time).getUTCHours()+9)%24).padStart(2,'0')).map(x=>[x.k,x.n,x.win.toFixed(1)+'%',x.avg.toFixed(3)+'%']));\n  $('btRegimeStats').innerHTML='\u003ch3>\ub300\uc138 Regime\u003c/h3>'+table(['\uad6d\uba74','\uac70\ub798','\uc2b9\ub960','\uae30\ub300\uac12','PF'],group(all,x=>x.marketRegime||'\u2014').map(x=>[x.k,x.n,x.win.toFixed(1)+'%',x.avg.toFixed(3)+'%',x.pf===Infinity?'\u221e':x.pf.toFixed(2)]));\n  $('btRiskStats').innerHTML='\u003ch3>\uccad\uc0b0 \uc6d0\uc778\u003c/h3>'+table(['\uacb0\uacfc','\uac70\ub798','\uc2b9\ub960','\ud3c9\uade0'],group(all,x=>x.reason).map(x=>[x.k,x.n,x.win.toFixed(1)+'%',x.avg.toFixed(3)+'%']));\n  LAST={out,all,stats:s,opts};\n}\nfunction quality(q){if(!q.n)return-999;const sample=Math.min(1,q.n/30),pf=Math.min(1.6,Math.max(0,Number.isFinite(q.pf)?q.pf:1.6))/1.6,mdd=Math.max(0,1-Math.min(25,q.mdd)/25),ev=Math.max(0,Math.min(1,(q.avg+.10)/.8));return(sample*.25+pf*.30+mdd*.20+ev*.25)*100}\nfunction judge(q,wf){if(!q||q.n\u003c15)return'\u26aa \ud45c\ubcf8 \ubd80\uc871: \ucd5c\uc18c 15\ud68c, \uac00\ub2a5\ud558\uba74 30\ud68c \uc774\uc0c1\uc758 \uac70\ub798\uac00 \ud544\uc694\ud569\ub2c8\ub2e4.';const qs=quality(q);if(wf&&wf.n>=10&&wf.avg>0&&wf.net>0&&wf.pf>1&&qs>=60)return`\ud83d\udfe2 \uc5f0\uad6c \ud6c4\ubcf4: \uc548\uc815\uc131 ${qs.toFixed(0)}/100 \u00b7 \uac80\uc99d \uae30\ub300\uac12 ${wf.avg.toFixed(3)}% \u00b7 \uac80\uc99d \ubcf5\ub9ac ${wf.net.toFixed(2)}%`;if(qs>=65&&q.avg>0&&q.pf>1&&q.mdd\u003c12)return`\ud83d\udfe1 \uc5f0\uad6c \uc6b0\uc218: \uc548\uc815\uc131 ${qs.toFixed(0)}/100. \ubcc4\ub3c4 \ubbf8\ub798\uad6c\uac04\uacfc \ud398\uc774\ud37c \ud2b8\ub808\uc774\ub529 \ud655\uc778\uc774 \ud544\uc694\ud569\ub2c8\ub2e4.`;return`\ud83d\udd34 \ubcf4\ub958: \uc548\uc815\uc131 ${qs.toFixed(0)}/100. \uc218\uc775\uc131 \ub610\ub294 \ub9ac\uc2a4\ud06c\uac00 \ucda9\ubd84\ud788 \ud655\uc778\ub418\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4.`}\nfunction researchCandidates(base){\n  const ths=[75,80,85,90],out=[];\n  if(base.mode==='regime'||base.mode==='regimeq'){for(const th of ths)out.push({...base,threshold:th,profile:base.mode==='regimeq'?'Regime Quality':'Regime Dynamic'});\n  }else if(base.mode==='adaptive'){\n    const profiles=[['\uc881\uac8c',1.2,2.0,.8],['\uade0\ud615',1.6,2.5,1.1],['\ub113\uac8c',2.0,3.0,1.4]];\n    for(const th of ths)for(const [name,atrSl,atrTp,trail] of profiles)out.push({...base,threshold:th,atrSl,atrTp,trail,profile:name});\n  }else if(base.mode==='legacy'){\n    for(const th of ths)for(const [tp,sl] of [[1.0,.7],[1.2,.8],[1.6,1.0],[2.0,1.2]])out.push({...base,threshold:th,tp,sl,profile:`TP${tp}/SL${sl}`});\n  }else for(const th of ths)out.push({...base,threshold:th,profile:'\uc2e4\uc804 SELL'});\n  return out;\n}\n\n/* =========================================================\n   \ud1b5\ud569 \uc2e4\uc2dc\uac04 \ucf54\uc778 \ubaa9\ub85d: \ud604\uc7ac\uac00 / 24\uc2dc\uac04 / \uae40\ud504\n   - Upbit: \ud604\uc7ac\uac00 + \uc804\uc77c \uc885\uac00 \uae30\uc900 signed_change_rate\n   - Binance: USDT \uac00\uaca9\n   - USD/KRW: \uacf5\uac1c \ud658\uc728\n========================================================= */\nconst DEFAULT_MARKET_COINS=[\n  ['BTC','\ube44\ud2b8\ucf54\uc778','KRW-BTC'],['ETH','\uc774\ub354\ub9ac\uc6c0','KRW-ETH'],['SOL','\uc194\ub77c\ub098','KRW-SOL'],['XRP','\uc5d1\uc2a4\uc54c\ud53c','KRW-XRP'],\n  ['HBAR','\ud5e4\ub370\ub77c','KRW-HBAR'],['ONDO','\uc628\ub3c4\ud30c\uc774\ub0b8\uc2a4','KRW-ONDO'],['LINK','\uccb4\uc778\ub9c1\ud06c','KRW-LINK'],['AVAX','\uc544\ubc1c\ub780\uccb4','KRW-AVAX'],\n  ['DOGE','\ub3c4\uc9c0\ucf54\uc778','KRW-DOGE'],['SUI','\uc218\uc774','KRW-SUI'],['TAO','\ube44\ud2b8\ud150\uc11c','KRW-TAO'],['UNI','\uc720\ub2c8\uc2a4\uc651','KRW-UNI'],\n  ['AAVE','\uc5d0\uc774\ube0c','KRW-AAVE'],['NEAR','\ub2c8\uc5b4\ud504\ub85c\ud1a0\ucf5c','KRW-NEAR'],['ALGO','\uc54c\uace0\ub79c\ub4dc','KRW-ALGO'],['APT','\uc571\ud1a0\uc2a4','KRW-APT'],\n  ['ICP','\uc778\ud130\ub137\ucef4\ud4e8\ud130','KRW-ICP'],['XLM','\uc2a4\ud154\ub77c\ub8e8\uba58','KRW-XLM'],['ADA','\uc5d0\uc774\ub2e4','KRW-ADA'],['GRT','\uadf8\ub798\ud504','KRW-GRT']\n];\nlet MARKET_COINS=(()=>{\n  try{\n    const saved=JSON.parse(localStorage.getItem('marketCoinsV1')||'null');\n    if(Array.isArray(saved)&&saved.length)return saved;\n  }catch(e){}\n  return DEFAULT_MARKET_COINS.map(x=>x.slice());\n})();\nconst COIN_NAME_MAP=Object.fromEntries(DEFAULT_MARKET_COINS.map(x=>[x[0],x[1]]));\nfunction saveMarketCoins(){localStorage.setItem('marketCoinsV1',JSON.stringify(MARKET_COINS));}\nfunction addMarketCoin(){\n  let sym=($('marketAddSymbol')?.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').trim();\n  if(!sym)return;\n  if(MARKET_COINS.some(x=>x[0]===sym)){ $('marketAddSymbol').value=''; return; }\n  MARKET_COINS.push([sym,COIN_NAME_MAP[sym]||sym,'KRW-'+sym]); saveMarketCoins();\n  $('marketAddSymbol').value=''; renderMarketList(); initRSControls(true); loadMarketUpbit(); loadMarketCharts();\n}\nfunction removeMarketCoin(sym){\n  if(sym==='BTC'){alert('BTC\ub294 \uae30\uc900 \ucf54\uc778\uc774\ub77c \uc0ad\uc81c\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.');return;}\n  MARKET_COINS=MARKET_COINS.filter(x=>x[0]!==sym); saveMarketCoins();\n  if(marketSelected===sym)marketSelected='BTC';\n  renderMarketList(); updateMarketSelected(); initRSControls(true);\n}\n\nconst MARKET_DATA={};\nlet marketSelected='BTC';\nlet marketUsdKrw=null;\n\nfunction marketNum(x){return Number.isFinite(Number(x))?Number(x):null}\nfunction marketPrice(x){\n  if(x==null)return '\u2014';\n  const n=Number(x);\n  if(n>=1000)return Math.round(n).toLocaleString('ko-KR');\n  if(n>=1)return n.toLocaleString('ko-KR',{maximumFractionDigits:2});\n  return n.toLocaleString('ko-KR',{maximumFractionDigits:8});\n}\nfunction marketPct(x){return x==null?'\u2014':(x>0?'+':'')+Number(x).toFixed(2)+'%'}\nfunction marketCls(x){return x>0?'m-up':x\u003c0?'m-down':'m-flat'}\n\nfunction marketSpark(symbol){\n  const d=MARKET_DATA[symbol]||{};\n  const raw=Array.isArray(d.chart24)?d.chart24.slice():[];\n  if(d.price!=null && raw.length){\n    raw[raw.length-1]=Number(d.price);\n  }\n  const vals=raw.filter(Number.isFinite);\n  if(vals.length\u003c2){\n    return '\u003cdiv class=\"market-spark\" title=\"24\uc2dc\uac04 \ucc28\ud2b8 \uc900\ube44\uc911\">\u2014\u003c/div>';\n  }\n  const min=Math.min(...vals), max=Math.max(...vals);\n  const range=(max-min)||Math.max(Math.abs(max)*0.0001,1);\n  const w=92,h=34,pad=2;\n  const points=vals.map((v,i)=>{\n    const x=pad+(i/(vals.length-1))*(w-pad*2);\n    const y=h-pad-((v-min)/range)*(h-pad*2);\n    return `${x.toFixed(1)},${y.toFixed(1)}`;\n  }).join(' ');\n  const trend=Number(d.change24);\n  const stroke=trend>0?'#d93025':trend\u003c0?'#1976d2':'#64748b';\n  return `\u003cdiv class=\"market-spark\" title=\"\ucd5c\uadfc 24\uc2dc\uac04 \u00b7 1\uc2dc\uac04\ubd09\">\n    \u003csvg viewBox=\"0 0 92 34\" preserveAspectRatio=\"none\" aria-label=\"${symbol} \ucd5c\uadfc 24\uc2dc\uac04 \ucc28\ud2b8\">\n      \u003cline class=\"spark-grid\" x1=\"2\" y1=\"17\" x2=\"90\" y2=\"17\">\u003c/line>\n      \u003cpolyline points=\"${points}\" fill=\"none\" stroke=\"${stroke}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/polyline>\n    \u003c/svg>\n  \u003c/div>`;\n}\n\nfunction renderMarketList(){\n  const q=($('marketSearch')?.value||'').trim().toLowerCase();\n  let list=MARKET_COINS.filter(c=>!q||c[0].toLowerCase().includes(q)||c[1].toLowerCase().includes(q));\n\n  // 24\uc2dc\uac04 \uc0c1\uc2b9\ub960 \uae30\uc900\uc73c\ub85c \ud56d\uc0c1 \uc2e4\uc2dc\uac04 \uc815\ub82c.\n  // \uac80\uc0c9\uc5b4\uac00 \uc5c6\uc744 \ub54c\ub294 \uc0c1\uc2b9\ub960 \ub192\uc740 \ucf54\uc778\uc774 \uc704\ub85c, \ud558\ub77d\ub960\uc774 \ud070 \ucf54\uc778\uc774 \uc544\ub798\ub85c \uc774\ub3d9\ud569\ub2c8\ub2e4.\n  // \uac19\uc740 \ubcc0\ub3d9\ub960\uc774\uba74 \uae30\uc874 \ucf54\uc778 \ubaa9\ub85d \uc21c\uc11c\ub97c \uc720\uc9c0\ud569\ub2c8\ub2e4.\n  list = list\n    .map((c, i) => ({ c, i, change: Number(MARKET_DATA[c[0]]?.change24) }))\n    .sort((a, b) => {\n      const av = Number.isFinite(a.change) ? a.change : -Infinity;\n      const bv = Number.isFinite(b.change) ? b.change : -Infinity;\n      return (bv - av) || (a.i - b.i);\n    })\n    .map(x => x.c);\n\n  $('marketList').innerHTML=list.map(c=>{\n    const d=MARKET_DATA[c[0]]||{};\n    return `\u003cdiv class=\"market-row ${marketSelected===c[0]?'active':''}\" data-market-symbol=\"${c[0]}\">\n      \u003cdiv class=\"market-name\">\u003cspan class=\"market-star\">\u2605\u003c/span>\u003cdiv>\u003cdiv class=\"market-symbol\">${c[0]}\u003c/div>\u003cdiv class=\"market-korean\">${c[1]}\u003c/div>\u003c/div>\u003cbutton class=\"market-remove\" data-remove-symbol=\"${c[0]}\" title=\"\ubaa9\ub85d\uc5d0\uc11c \uc0ad\uc81c\">\u00d7\u003c/button>\u003c/div>\n      \u003cdiv class=\"market-price\">${marketPrice(d.price)}\u003c/div>\n      \u003cdiv class=\"market-change ${marketCls(d.change24)}\">${marketPct(d.change24)}\u003c/div>\n      \u003cdiv class=\"market-premium ${marketCls(d.premium)}\">${marketPct(d.premium)}\u003c/div>\n      ${marketSpark(c[0])}\n    \u003c/div>`;\n  }).join('');\n  document.querySelectorAll('[data-remove-symbol]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();removeMarketCoin(btn.dataset.removeSymbol);});\n  document.querySelectorAll('[data-market-symbol]').forEach(el=>el.onclick=()=>{\n    marketSelected=el.dataset.marketSymbol;\n    updateMarketSelected();\n    renderMarketList();\n  });\n}\nfunction updateMarketSelected(){\n  const c=MARKET_COINS.find(x=>x[0]===marketSelected)||MARKET_COINS[0],d=MARKET_DATA[marketSelected]||{};\n  $('marketSelected').innerHTML=`\uc120\ud0dd: \u003cb>${c[0]} ${c[1]}\u003c/b> \u00b7 ${marketPrice(d.price)}\uc6d0 \u00b7 \u003cspan class=\"${marketCls(d.change24)}\">${marketPct(d.change24)}\u003c/span> \u00b7 \uae40\ud504 \u003cspan class=\"${marketCls(d.premium)}\">${marketPct(d.premium)}\u003c/span>`;\n}\nconst chartSleep=ms=>new Promise(r=>setTimeout(r,ms));\n\nasync function loadMarketCharts(){\n  // Upbit 1\uc2dc\uac04\ubd09 24\uac1c = \ucd5c\uadfc \uc57d 24\uc2dc\uac04. \ucd08\uae30 \ub85c\ub529/\uc8fc\uae30 \uac31\uc2e0\uc740 1\ud68c\uc529 \uc21c\ucc28 \ud638\ucd9c\ud574 \ud638\ucd9c\ub7c9\uc744 \uc644\ud654\ud569\ub2c8\ub2e4.\n  for(const c of MARKET_COINS){\n    try{\n      const url=workerBase()+'/upbit?path='+encodeURIComponent('/v1/candles/minutes/60?market='+c[2]+'&count=24');\n      const r=await fetch(url,{cache:'no-store'});\n      if(!r.ok)throw Error('Candle '+r.status);\n      const rows=await r.json();\n      const closes=rows.slice().reverse().map(x=>Number(x.trade_price)).filter(Number.isFinite);\n      MARKET_DATA[c[0]]={...(MARKET_DATA[c[0]]||{}),chart24:closes};\n    }catch(e){\n      console.warn('market chart '+c[0]+':',e.message);\n    }\n    await sparkWait(130);\n  }\n  renderMarketList();\n}\n\nfunction rsSymbols(){return [...new Set(['BTC',...MARKET_COINS.map(c=>c[0])])];}\nlet rsSeries={};\nconst RS_PALETTE=['#1976d2','#d93025','#0f9d58','#7c3aed','#f59e0b','#0891b2','#db2777','#65a30d','#ea580c','#475569','#2563eb','#be123c','#15803d','#9333ea','#ca8a04','#0e7490','#be185d','#4d7c0f','#c2410c','#334155'];\n\nfunction initRSControls(preserve=false){\n  const defaults=['BTC','ETH','SOL','XRP','HBAR','ONDO','LINK','UNI','AAVE','NEAR','ALGO','APT','ICP','XLM','ADA','GRT','AVAX','DOGE','SUI','TAO'];\n  const symbols=rsSymbols();\n  for(let i=1;i\u003c=20;i++){\n    const el=$('rsCoin'+i); if(!el)continue;\n    const old=preserve?el.value:'';\n    el.innerHTML=symbols.map(sym=>`\u003coption value=\"${sym}\">${sym} \u00b7 ${COIN_NAME_MAP[sym]||sym}\u003c/option>`).join('');\n    el.value=symbols.includes(old)?old:(symbols.includes(defaults[i-1])?defaults[i-1]:symbols[(i-1)%symbols.length]);\n    if(!el.dataset.bound){el.addEventListener('change',()=>loadRSCandles());el.dataset.bound='1';}\n    const cb=$('rsShow'+i);\n    if(cb){\n      const saved=localStorage.getItem('rsShow'+i);\n      if(saved!==null)cb.checked=saved==='1';\n      if(!cb.dataset.bound){cb.addEventListener('change',()=>{localStorage.setItem('rsShow'+i,cb.checked?'1':'0');drawRSChart();});cb.dataset.bound='1';}\n    }\n  }\n}\nasync function loadRSCandles(){\n  const targets=[...new Set(Array.from({length:20},(_,i)=>$('rsCoin'+(i+1))?.value).filter(Boolean))];\n  const out={};\n  for(const sym of targets){\n    try{\n      const url=workerBase()+'/upbit?path='+encodeURIComponent('/v1/candles/minutes/5?market=KRW-'+sym+'&count=24');\n      const r=await fetch(url,{cache:'no-store'}); if(!r.ok)throw Error('Candle '+r.status);\n      const rows=await r.json();\n      const closes=rows.slice().reverse().map(x=>Number(x.trade_price)).filter(Number.isFinite);\n      if(closes.length>=2){const base=closes[0];out[sym]=closes.map(v=>base?((v/base)-1)*100:0);}\n      await sparkWait(120);\n    }catch(e){console.warn('RS chart '+sym+':',e.message);}\n  }\n  rsSeries=out; drawRSChart();\n}\nfunction drawRSChart(){\n  const c=$('rsChart'); if(!c)return;\n  const rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;\n  const w=Math.max(300,Math.floor(rect.width||520)),h=Math.max(220,Math.floor(rect.height||260));\n  c.width=Math.floor(w*dpr);c.height=Math.floor(h*dpr);\n  const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);\n  const syms=Array.from({length:20},(_,i)=>$('rsShow'+(i+1))?.checked?$('rsCoin'+(i+1))?.value:null).filter(Boolean);\n  if(!syms.length||!Object.keys(rsSeries).length){ctx.fillStyle='#64748b';ctx.font='12px Arial';ctx.fillText('\uc0c1\ub300\uac15\ub3c4 \ucc28\ud2b8 \ub300\uae30\uc911\u2026',16,28);return;}\n  const left=44,right=138,top=18,bottom=30;\n  const all=syms.flatMap(sym=>rsSeries[sym]||[]),min=Math.min(0,...all),max=Math.max(0,...all),range=(max-min)||1;\n  ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;\n  [0,.25,.5,.75,1].forEach(t=>{const y=top+(h-top-bottom)*t;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();});\n  ctx.fillStyle='#94a3b8';ctx.font='10px Arial';\n  for(let i=0;i\u003c=4;i++){const v=max-range*(i/4),y=top+(h-top-bottom)*(i/4)+3;ctx.fillText((v>=0?'+':'')+v.toFixed(2)+'%',4,y);}\n  syms.forEach((sym,idx)=>{\n    const vals=rsSeries[sym];if(!vals||vals.length\u003c2)return;\n    const color=RS_PALETTE[idx%RS_PALETTE.length];ctx.strokeStyle=color;ctx.lineWidth=1.8;ctx.beginPath();\n    let lastX=left,lastY=top;\n    vals.forEach((v,i)=>{const x=left+(i/(vals.length-1))*(w-left-right),y=top+(max-v)/range*(h-top-bottom);lastX=x;lastY=y;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();\n    ctx.fillStyle=color;ctx.font='bold 10px Arial';ctx.textBaseline='middle';\n    ctx.fillText(`${sym} ${COIN_NAME_MAP[sym]||''}`.trim(),Math.min(lastX+5,w-right+4),lastY);\n  });\n  $('rsLegend').innerHTML=syms.map((sym,i)=>`\u003cspan>\u003ci style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:${RS_PALETTE[i%RS_PALETTE.length]};margin-right:4px\">\u003c/i>${sym}\u003c/span>`).join('');\n}\n\n// \uc0c1\ub2e8 BTC \uac00\uaca9 \uce74\ub4dc\ub97c \uc88c\uce21 '\uc2e4\uc2dc\uac04 \ucf54\uc778 \ubaa8\ub2c8\ud130'\uc640 \uac19\uc740 \uc5c5\ube44\ud2b8 \uc2e4\uc2dc\uac04 \uc2dc\uc138(5\ucd08 \uac31\uc2e0)\ub85c \ub9de\ucda4.\n// \uc2e4\uc2dc\uac04 \uac12\uc774 \uc544\uc9c1 \uc5c6\uc73c\uba74 \ub9c8\uc9c0\ub9c9 \uc2a4\uce94 \uac12\uc73c\ub85c \ub300\uccb4.\nfunction updateTopBtc(){\n  const el=$('btc'); if(!el) return;\n  const live=Number(MARKET_DATA?.BTC?.price);\n  const v=Number.isFinite(live)&&live>0?live:Number(window.SCAN_BTC_PRICE);\n  if(Number.isFinite(v)) el.textContent=money(v);\n}\nasync function loadMarketUpbit(){\n  try{\n    const markets=MARKET_COINS.map(c=>c[2]).join(',');\n    const r=await fetch(workerBase()+'/upbit?path='+encodeURIComponent('/v1/ticker?markets='+markets),{cache:'no-store'});\n    if(!r.ok)throw Error('Upbit '+r.status);\n    const rows=await r.json();\n    rows.forEach(x=>{const c=MARKET_COINS.find(v=>v[2]===x.market);if(!c)return;MARKET_DATA[c[0]]={...(MARKET_DATA[c[0]]||{}),price:+x.trade_price,change24:+x.signed_change_rate*100,changePrice:+x.signed_change_price,volume24:+x.acc_trade_volume_24h,updated:+x.timestamp}});\n    renderMarketList();updateMarketSelected();updateTopBtc();\n  }catch(e){console.warn('market Upbit:',e.message)}\n}\nasync function loadMarketBinance(){\n  try{\n    const r=await fetch('https://api.binance.com/api/v3/ticker/price',{cache:'no-store'});\n    if(!r.ok)throw Error('Binance '+r.status);\n    const rows=await r.json();\n    const wanted=new Map(MARKET_COINS.map(c=>[c[0]+'USDT',c[0]]));\n    rows.forEach(x=>{const sym=wanted.get(x.symbol);if(sym)MARKET_DATA[sym]={...(MARKET_DATA[sym]||{}),binance:+x.price}});\n    calcMarketPremium();\n  }catch(e){console.warn('market Binance:',e.message)}\n}\nasync function loadMarketFx(){\n  try{\n    const r=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});\n    if(!r.ok)throw Error('FX '+r.status);\n    const j=await r.json();marketUsdKrw=+j.rates.KRW;calcMarketPremium();\n  }catch(e){console.warn('market FX:',e.message)}\n}\nfunction calcMarketPremium(){\n  MARKET_COINS.forEach(c=>{const d=MARKET_DATA[c[0]]||{};if(d.price&&d.binance&&marketUsdKrw){d.premium=(d.price/(d.binance*marketUsdKrw)-1)*100}else d.premium=null;});\n  renderMarketList();updateMarketSelected();\n}\nasync function refreshMarket(){await Promise.allSettled([loadMarketUpbit(),loadMarketBinance(),loadMarketFx()]);calcMarketPremium()}\n$('marketSearch')?.addEventListener('input',renderMarketList);\n\n$('rsShowAll')?.addEventListener('click',()=>{for(let i=1;i\u003c=20;i++){const c=$('rsShow'+i);if(c){c.checked=true;localStorage.setItem('rsShow'+i,'1')}}drawRSChart();});\n$('rsHideAll')?.addEventListener('click',()=>{for(let i=1;i\u003c=20;i++){const c=$('rsShow'+i);if(c){c.checked=false;localStorage.setItem('rsShow'+i,'0')}}drawRSChart();});\n\n$('marketAddBtn')?.addEventListener('click',addMarketCoin);\n$('marketAddSymbol')?.addEventListener('keydown',e=>{if(e.key==='Enter')addMarketCoin();});\n$('marketResetBtn')?.addEventListener('click',()=>{MARKET_COINS=DEFAULT_MARKET_COINS.map(x=>x.slice());saveMarketCoins();renderMarketList();updateMarketSelected();initRSControls(true);refreshMarket();});\n\nrefreshMarket();\nloadMarketCharts();\ninitRSControls();\n\nasync function runLocalRegimeScan(showLog=true){\n  setConn('Regime \ubd84\uc11d \uc911\u2026','var(--yellow)');\n  try{\n    const btc=await fetchK('BTC',200);\n    const daily=await fetchDay(200);\n    if(btc.length\u003c60)throw Error(`BTC 5\ubd84\ubd09 \ub370\uc774\ud130 \ubd80\uc871 \u00b7 ${btc.length}\uac1c \uc218\uc2e0 / \ucd5c\uc18c 60\uac1c`);\n    const asOf=(btc.at(-1)?.[0]||Date.now())+FIVE_MIN;\n    const marketRegime=analyzeMarketRegime(daily);\n    const threshold=Number(SERVER_CFG.minScore)||75;\n    const results=[];\n    for(const sym of COINS){\n      try{\n        const k=await fetchK(sym,200);\n        if(k.length\u003c60)continue;\n        const z=calcScore(k,btc,threshold,asOf,marketRegime,true,false);\n        const score=Number(z.score)||0;\n        const adjustedScore=Math.max(0,Math.min(100,score+(Number(z.patternScore)||0)*2));\n        const confidence=Math.round(Math.max(0,Math.min(100,adjustedScore)));\n        const price=Number(z.price);\n        const signal=z.buy?'BUY':adjustedScore>=Math.max(55,threshold-12)?'WATCH':'IDLE';\n        results.push({...z,symbol:sym,adjustedScore,confidence,signal,\n          reasons:[z.regime==='RISK_ON'?'BTC \ub2e8\uae30 Risk-On':'BTC \ub2e8\uae30 Risk-Off',`Score ${Math.round(score)}`],\n          patternReasons:z.pattern?.reasons||[],\n          fibonacciScore:Number(z.patternScore)||0,\n          tp1:Number.isFinite(price)?price*(1+(SERVER_CFG.tp1Pct||1.2)/100):null,\n          tp2:Number.isFinite(price)?price*(1+(SERVER_CFG.tp2Pct||2.2)/100):null,\n          fibonacciTp1618:Number.isFinite(price)?price*(1+((SERVER_CFG.tp2Pct||2.2)*1.35)/100):null,\n          sl:Number.isFinite(price)?price*(1-(SERVER_CFG.stopLossPct||.8)/100):null\n        });\n      }catch(e){console.warn('Regime '+sym,e);}\n      await sparkWait(80);\n    }\n    const vals=results.map(x=>Number(x.adjustedScore)).filter(Number.isFinite);\n    const altMean=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;\n    const bp=closes(btc);\n    const d={\n      source:'browser-live',\n      scannedAt:Date.now(),\n      candleStart:btc.at(-1)?.[0]||Date.now(),\n      btcPrice:bp.at(-1),\n      btcRsi:RSI(bp,14),\n      btcRet5:bp.length>1?pct(bp.at(-1),bp.at(-2)):null,\n      marketRegime,\n      altRegime:{state:altMean>=62?'BROAD_RALLY':altMean>=48?'ROTATION':'RANGE',mean:altMean},\n      results\n    };\n    render(d);\n    if(showLog)log(`Regime \uc2e4\uc2dc\uac04 \ubd84\uc11d \uc644\ub8cc \u00b7 ${results.length}\uc885\ubaa9 \u00b7 ${kst(d.scannedAt)} KST`);\n    setConn('Regime \uc2e4\uc2dc\uac04 \ubd84\uc11d \uc5f0\uacb0\ub428','var(--green)');\n    return d;\n  }catch(e){\n    const msg=(e?.message||String(e));\n    const shortMsg=msg.length>72?msg.slice(0,72)+'\u2026':msg;\n    setConn('Regime \uc2e4\ud328 \u00b7 '+shortMsg,'var(--red)');\n    log('Regime \ubd84\uc11d \uc624\ub958: '+msg);\n    console.error('Regime diagnostic:',e);\n    throw e;\n  }\n}\n\n/* =========================================================\n   \uc21c\ud658\ub9e4 \ub808\uc774\ub354 \u00b7 BTC \ub300\ube44 \uc790\uae08 \uc774\ub3d9 (\ube0c\ub77c\uc6b0\uc800 \uacc4\uc0b0, Worker /upbit \ud504\ub85d\uc2dc \uc0ac\uc6a9)\n   - Worker BUY/SELL \ub85c\uc9c1\uacfc \ubb34\uad00. \ud654\uba74 \uad00\ucc30\uc6a9.\n   ========================================================= */\nconst ROT_DEFAULT_COINS=[['NEAR','\ub2c8\uc5b4'],['AAVE','\uc5d0\uc774\ube0c'],['TAO','\ube44\ud2b8\ud150\uc11c'],['UNI','\uc720\ub2c8\uc2a4\uc651'],['ONDO','\uc628\ub3c4'],['XLM','\uc2a4\ud154\ub77c\ub8e8\uba58'],['HBAR','\ud5e4\ub370\ub77c'],['XRP','\uc5d1\uc2a4\uc54c\ud53c'],['ADA','\uc5d0\uc774\ub2e4'],['POL','\ud3f4\ub9ac\uace4']];\nconst ROT_COINS_KEY='rotCoinsV1',ROT_MAX_COINS=30;\nlet ROT_COINS=(()=>{\n  try{\n    const s=JSON.parse(localStorage.getItem(ROT_COINS_KEY)||'null');\n    if(Array.isArray(s)&&s.length&&s.every(x=>Array.isArray(x)&&/^[A-Z0-9]{2,10}$/.test(x[0])&&x[0]!=='BTC'))return s.slice(0,ROT_MAX_COINS).map(x=>[x[0],String(x[1]||x[0])]);\n  }catch(e){}\n  return ROT_DEFAULT_COINS.map(x=>x.slice());\n})();\nconst rotSaveCoins=()=>{try{localStorage.setItem(ROT_COINS_KEY,JSON.stringify(ROT_COINS))}catch(e){}};\nlet rotRaw=null,rotUniverse=null; // rotRaw={btc,data} \ub9c8\uc9c0\ub9c9 \uc218\uc9d1 \uc6d0\ubcf8, rotUniverse=Map(\uc2ec\ubcfc\u2192\ud55c\uae00\uba85)\nconst ROT_REFRESH_MS=5*60*1000,ROT_HIST_KEY='rotHistV1',ROT_HIST_MAX=36;\nconst ROT_STATE={INFLOW:{txt:'\ud83d\udd04 \uc21c\ud658\ub9e4 \uc720\uc785',cls:'inflow',ord:0},EXIT:{txt:'\u26a0 \uc774\ud0c8 \uacbd\uace0',cls:'exit',ord:1},STRONG:{txt:'\ud83d\udd25 \uac15\ud55c \ucd94\uc138',cls:'strong',ord:2},HOLD:{txt:'\ucd94\uc138 \uc720\uc9c0',cls:'hold',ord:3},WATCH:{txt:'\uad00\ub9dd',cls:'',ord:4}};\nlet rotBusy=false,rotLast=null,rotLastOkAt=0,rotNextAt=Date.now()+ROT_REFRESH_MS,rotSort=localStorage.getItem('rotSortV1')||'state';\nconst rotClamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));\nconst rotSc=(x,k)=>rotClamp(50+50*Math.tanh(x/k));\nconst rotStart=c=>new Date(c.candle_date_time_utc+'Z').getTime();\nconst rotPct=x=>x==null||!Number.isFinite(x)?'\u2014':(x>0?'+':'')+x.toFixed(2)+'%';\nconst rotHM=t=>new Date(t).toLocaleTimeString('ko-KR',{hour12:false});\n\nfunction rotFriendly(e){\n  const m=String(e?.message||e||'');\n  if(/^Worker URL/.test(m))return m;\n  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Worker\uc5d0 \uc5f0\uacb0\ud558\uc9c0 \ubabb\ud588\uc2b5\ub2c8\ub2e4. Worker URL\uc774 \ub9de\ub294\uc9c0, Worker\uac00 \ubc30\ud3ec\ub418\uc5b4 \uc788\ub294\uc9c0 \ud655\uc778\ud558\uc138\uc694.';\n  if(/invalid path|HTTP 404/i.test(m))return 'Worker\uc5d0 /upbit \uacbd\ub85c\uac00 \uc5c6\uc2b5\ub2c8\ub2e4. \ucd5c\uc2e0 worker.js\ub97c \ub2e4\uc2dc \ubc30\ud3ec\ud558\uc138\uc694.';\n  return m;\n}\nasync function rotUpbit(path,tries=3){\n  let last;\n  for(let i=0;i\u003ctries;i++){\n    try{\n      const base=workerBase();\n      const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),10000);\n      let r,txt;\n      try{r=await fetch(base+'/upbit?path='+encodeURIComponent(path),{cache:'no-store',signal:ctrl.signal});txt=await r.text();}\n      finally{clearTimeout(t);}\n      let d;try{d=JSON.parse(txt)}catch{throw Error('Worker\uac00 JSON\uc774 \uc544\ub2cc \uc751\ub2f5\uc744 \ubcf4\ub0c8\uc2b5\ub2c8\ub2e4 (HTTP '+r.status+')')}\n      if(r.status===429)throw Error('Upbit \uc694\uccad \uc81c\ud55c(429)');\n      if(!r.ok)throw Error((d&&(d.error?.message||d.error))||('HTTP '+r.status));\n      if(!Array.isArray(d)||!d.length)throw Error('\uce94\ub4e4 \ub370\uc774\ud130\uac00 \ube44\uc5b4 \uc788\uc2b5\ub2c8\ub2e4');\n      return d;\n    }catch(e){\n      if(/^Worker URL/.test(e.message))throw e;\n      last=e.name==='AbortError'?Error('\uc751\ub2f5 \uc2dc\uac04\ucd08\uacfc'):e;\n      if(i\u003ctries-1)await sparkWait(700*(i+1)+Math.floor(Math.random()*200));\n    }\n  }\n  throw last;\n}\nasync function rotLoadCoin(sym){\n  const m='KRW-'+sym;\n  const c5=await rotUpbit('/v1/candles/minutes/5?market='+m+'&count=50');\n  await sparkWait(220);\n  const c60=await rotUpbit('/v1/candles/minutes/60?market='+m+'&count=27');\n  return {c5,c60};\n}\nfunction rotPriceAgo(c,ms,span,refNow){\n  const target=refNow-ms;\n  for(const x of c){if(rotStart(x)+span\u003c=target)return +x.trade_price}\n  return null;\n}\nfunction rotReturns(d,refNow){\n  const now=+d.c5[0].trade_price;\n  const f=p=>p?(now/p-1)*100:null;\n  return {r1:f(rotPriceAgo(d.c5,3600e3,300e3,refNow)),r4:f(rotPriceAgo(d.c5,4*3600e3,300e3,refNow)),r24:f(rotPriceAgo(d.c60,24*3600e3,3600e3,refNow))};\n}\n/* \uc21c\uc218 \uacc4\uc0b0: btc={c5,c60}, data={SYM:{c5,c60}|{error}} \u2192 \ud589 \ubc30\uc5f4 */\nfunction rotCompute(btc,data,coins){\n  const refNow=rotStart(btc.c5[0])+300e3;\n  const b=rotReturns(btc,refNow);\n  const bMap=new Map(btc.c5.map(x=>[rotStart(x),x]));\n  const barStarts=btc.c5.slice(1,13).map(rotStart);\n  const rows=coins.map(([sym,name])=>{\n    const d=data[sym];\n    if(!d||d.error)return {sym,name,ok:false,error:d?.error||'\ub370\uc774\ud130 \uc5c6\uc74c'};\n    const r=rotReturns(d,refNow);\n    if(r.r1==null||r.r4==null||r.r24==null)return {sym,name,ok:false,error:'\uce94\ub4e4 \ubd80\uc871(\uac70\ub798 \uacf5\ubc31)'};\n    const cMap=new Map(d.c5.map(x=>[rotStart(x),x]));\n    let wins=0;\n    for(const t of barStarts){\n      const bb=bMap.get(t),cc=cMap.get(t);if(!bb)continue;\n      const br=bb.trade_price/bb.opening_price-1,cr=cc?cc.trade_price/cc.opening_price-1:0;\n      if(cr>br)wins++;\n    }\n    const cutoff=refNow-3600e3;\n    const vNow=d.c5.filter(x=>rotStart(x)>=cutoff).reduce((s,x)=>s+(+x.candle_acc_trade_price||0),0);\n    const vBase=d.c60.slice(1,25).reduce((s,x)=>s+(+x.candle_acc_trade_price||0),0);\n    return {sym,name,ok:true,r1:r.r1,r4:r.r4,r24:r.r24,rel1:r.r1-b.r1,rel4:r.r4-b.r4,rel24:r.r24-b.r24,wins,vNow,vBase};\n  });\n  const ok=rows.filter(x=>x.ok);\n  const totNow=ok.reduce((s,x)=>s+x.vNow,0),totBase=ok.reduce((s,x)=>s+x.vBase,0);\n  ok.forEach(x=>{\n    x.shareNow=totNow>0?x.vNow/totNow*100:0;\n    x.shareBase=totBase>0?x.vBase/totBase*100:0;\n    x.shareDelta=x.shareNow-x.shareBase;\n    const hourly=x.vBase/24;\n    x.volSurge=hourly>0?x.vNow/hourly:1;\n    const win=x.wins/12*100;\n    x.trend=Math.round(.30*rotSc(x.rel24,4)+.25*rotSc(x.rel4,1.5)+.15*rotSc(x.rel1,.7)+.15*win+.15*rotSc(x.r24,6));\n    x.rot=Math.round(.30*rotSc(x.rel1-x.rel4/4,.5)+.20*rotSc(x.rel4-x.rel24/6,1)+.25*rotSc(x.shareDelta,3)+.15*win+.10*rotSc(x.volSurge-1,1));\n    x.state=rotJudge(x);\n  });\n  return {btc:b,rows};\n}\nfunction rotJudge(x){\n  if(x.trend>=60){\n    if(x.trend>=80&&((x.rel1\u003c-.4&&x.rel4\u003c0)||(x.shareDelta\u003c-2&&x.rot\u003c40)))return 'EXIT';\n    if(x.trend\u003c80&&x.rel1\u003c0&&x.shareDelta\u003c-2&&x.rot\u003c40)return 'EXIT';\n  }\n  if(x.trend>=80)return 'STRONG';\n  if(x.rot>=65&&x.rel1>0&&x.wins>=8&&x.shareDelta>0)return 'INFLOW';\n  if(x.trend>=60)return 'HOLD';\n  return 'WATCH';\n}\n/* \uc810\uc218 \ud750\ub984 \uae30\ub85d (\uc774 \ube0c\ub77c\uc6b0\uc800 localStorage) */\nfunction rotHistLoad(){try{return JSON.parse(localStorage.getItem(ROT_HIST_KEY)||'{}')||{}}catch{return {}}}\nfunction rotHistSave(h){try{localStorage.setItem(ROT_HIST_KEY,JSON.stringify(h))}catch{}}\nfunction rotHistPush(h,rows){\n  const now=Date.now();\n  rows.filter(x=>x.ok).forEach(x=>{\n    const a=h[x.sym]=(h[x.sym]||[]).filter(s=>now-s.t\u003cROT_HIST_MAX*ROT_REFRESH_MS);\n    const s={t:now,tr:x.trend,ro:x.rot};\n    if(a.length&&now-a[a.length-1].t\u003c240000)a[a.length-1]=s;else a.push(s);\n  });\n}\nfunction rotTrail(h,sym,key){\n  const now=Date.now();\n  return (h[sym]||[]).filter(s=>now-s.t\u003c=25*60000).slice(-3).map(s=>s[key]);\n}\nfunction rotArrow(t){\n  if(t.length\u003c2)return '';\n  const d=t[t.length-1]-t[0];\n  return d>=4?'\u003cspan class=\"rot-tr-up\">\u25b2\u003c/span>':d\u003c=-4?'\u003cspan class=\"rot-tr-down\">\u25bc\u003c/span>':'';\n}\nfunction rotRising(t){return t.length>=2&&t[t.length-1]-t[0]>=4}\n\nfunction rotVerdictOf(rows,hist){\n  const ok=rows.filter(x=>x.ok);\n  if(ok.length\u003c3)return {cls:'',title:'\ud310\uc815 \ubcf4\ub958',sub:'\uc218\uc9d1\ub41c \ucf54\uc778\uc774 3\uac1c \ubbf8\ub9cc\uc774\ub77c \uc21c\ud658\ub9e4\ub97c \ud310\ub2e8\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.'};\n  const lead=ok.filter(x=>x.state==='STRONG'||(x.state==='HOLD'&&x.trend>=70)).sort((a,b)=>b.trend-a.trend)[0];\n  const inflow=ok.filter(x=>x.state==='INFLOW').sort((a,b)=>b.rot-a.rot);\n  const exit=ok.filter(x=>x.state==='EXIT').sort((a,b)=>b.trend-a.trend);\n  const names=a=>a.map(x=>x.sym).join('/');\n  const tag=a=>a.map(x=>x.sym+' \uc21c\ud658\ub9e4 '+(rotTrail(hist,x.sym,'ro').join('\u2192')||x.rot)+(rotRising(rotTrail(hist,x.sym,'ro'))?' \u25b2':'')).join(' \u00b7 ');\n  if(inflow.length&&exit.length)\n    return {cls:'inflow',title:'\u2194 '+names(exit)+'\uc5d0\uc11c '+names(inflow)+'(\uc73c)\ub85c \uc790\uae08 \uc774\ub3d9 \ud6c4\ubcf4',sub:names(exit)+'\ub294 \uc0c1\ub300\uac15\ub3c4\uc640 \uac70\ub798\ub7c9 \uc810\uc720\uc728\uc774 \uc904\uace0, '+tag(inflow)+'. \ud55c\ub450 \ubc88 \ub354 \ud655\uc778\ub420 \ub54c\uae4c\uc9c0 \uad00\ucc30\ud558\uc138\uc694.'};\n  if(lead&&inflow.length)\n    return {cls:'inflow',title:'\ud83d\udd04 '+lead.sym+' \uc8fc\ub3c4 \uc0c1\uc2b9 + '+names(inflow)+' \ud6c4\ubc1c \uc21c\ud658\ub9e4 \uc720\uc785',sub:lead.sym+' \ucd94\uc138 '+(rotTrail(hist,lead.sym,'tr').join('\u2192')||lead.trend)+' \uc720\uc9c0 \u00b7 '+tag(inflow)+(inflow.some(x=>rotRising(rotTrail(hist,x.sym,'ro')))?'':' \u00b7 \uc544\uc9c1 \ucd08\uae30 \uc2e0\ud638(\uc810\uc218 \uc0c1\uc2b9 \ud655\uc778 \uc804)')};\n  if(exit.length)\n    return {cls:'exit',title:'\u26a0 '+names(exit)+' \uc774\ud0c8 \uacbd\uace0',sub:'BTC \ub300\ube44 \ud798\uc774 \uc57d\ud574\uc9c0\uace0 \uac70\ub798\ub7c9 \uc810\uc720\uc728\uc774 \uc904\uace0 \uc788\uc2b5\ub2c8\ub2e4. \ud6c4\ubc1c \ucf54\uc778\uc73c\ub85c\uc758 \uc720\uc785\uc740 \uc544\uc9c1 \ud655\uc778\ub418\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4.'};\n  if(lead)\n    return {cls:'lead',title:lead.sym+' \ub2e8\ub3c5 \uc8fc\ub3c4 \u00b7 \ud6c4\ubc1c \ud655\uc0b0\uc740 \uc544\uc9c1 \ud655\uc778\ub418\uc9c0 \uc54a\uc74c',sub:lead.sym+' \ucd94\uc138 '+(rotTrail(hist,lead.sym,'tr').join('\u2192')||lead.trend)+'. \uac15\ud558\ub2e4\ub294 \uc774\uc720\ub9cc\uc73c\ub85c \uc774\ud0c8\ub85c \ubcf4\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.'};\n  if(inflow.length)\n    return {cls:'inflow',title:'\ud6c4\ubc1c \uc21c\ud658\ub9e4 \ud6c4\ubcf4: '+names(inflow),sub:'\ub69c\ub837\ud55c \uc8fc\ub3c4 \ucf54\uc778\uc740 \uc5c6\uc2b5\ub2c8\ub2e4. '+tag(inflow)};\n  return {cls:'',title:'\ub69c\ub837\ud55c \uc21c\ud658 \uc2e0\ud638 \uc5c6\uc74c',sub:'\uc0c1\ub300\uac15\ub3c4\uc640 \uac70\ub798\ub7c9 \uc810\uc720\uc728\uc774 \ud568\uaed8 \uc62c\ub77c\uc624\ub294 \ucf54\uc778\uc774 \uc544\uc9c1 \uc5c6\uc2b5\ub2c8\ub2e4.'};\n}\nfunction rotScoreCell(v,trail,color){\n  return `\u003cspan class=\"rot-score\">\u003cb>${v}\u003c/b> ${rotArrow(trail)}\u003ci>\u003cu style=\"width:${v}%;background:${color}\">\u003c/u>\u003c/i>\u003csmall>${trail.length>=2?trail.join('\u2192'):'&nbsp;'}\u003c/small>\u003c/span>`;\n}\nfunction rotRender(res,hist,meta){\n  const ver=rotVerdictOf(res.rows,hist),vb=$('rotVerdict');\n  vb.className='rot-verdict'+(ver.cls?' '+ver.cls:'');\n  vb.innerHTML='\u003cb>\u003c/b>\u003cdiv class=\"small\">\u003c/div>';\n  vb.firstChild.textContent=ver.title;vb.lastChild.textContent=ver.sub;\n  $('rotBtc').innerHTML=`BTC \uae30\uc900 \u00b7 1\uc2dc\uac04 \u003cspan class=\"${marketCls(res.btc.r1)}\">${rotPct(res.btc.r1)}\u003c/span> \u00b7 4\uc2dc\uac04 \u003cspan class=\"${marketCls(res.btc.r4)}\">${rotPct(res.btc.r4)}\u003c/span> \u00b7 24\uc2dc\uac04 \u003cspan class=\"${marketCls(res.btc.r24)}\">${rotPct(res.btc.r24)}\u003c/span>`;\n  const rows=res.rows.slice();\n  const key={state:(a,b)=>(a.ok?ROT_STATE[a.state].ord:9)-(b.ok?ROT_STATE[b.state].ord:9)||(b.rot||0)-(a.rot||0),trend:(a,b)=>(b.trend??-1)-(a.trend??-1),rot:(a,b)=>(b.rot??-1)-(a.rot??-1)}[rotSort]||null;\n  if(key)rows.sort(key);\n  $('rotBody').innerHTML=rows.map(x=>{\n    if(!x.ok)return `\u003ctr class=\"rot-row-fail\">\u003ctd class=\"rot-coin\">\u003cb>${x.sym}\u003c/b>\u003cbutton type=\"button\" class=\"rot-del\" data-rot-del=\"${x.sym}\" title=\"\ubaa9\ub85d\uc5d0\uc11c \uc0ad\uc81c\">\u00d7\u003c/button>\u003cspan>${x.name}\u003c/span>\u003c/td>\u003ctd colspan=\"7\" style=\"text-align:center\" title=\"${String(x.error).replace(/\"/g,'')}\">\uc218\uc9d1 \uc2e4\ud328 \u00b7 ${String(x.error).replace(/\u003c/g,'')}\u003c/td>\u003ctd>\u2014\u003c/td>\u003c/tr>`;\n    const st=ROT_STATE[x.state];\n    const sh=`${x.shareNow.toFixed(1)}% \u003cspan class=\"${marketCls(x.shareDelta)}\">(${x.shareDelta>0?'+':''}${x.shareDelta.toFixed(1)}%p)\u003c/span>`;\n    return `\u003ctr>\u003ctd class=\"rot-coin\">\u003cb>${x.sym}\u003c/b>\u003cbutton type=\"button\" class=\"rot-del\" data-rot-del=\"${x.sym}\" title=\"\ubaa9\ub85d\uc5d0\uc11c \uc0ad\uc81c\">\u00d7\u003c/button>\u003cspan>${x.name}\u003c/span>\u003c/td>\n\u003ctd>${rotScoreCell(x.trend,rotTrail(hist,x.sym,'tr'),'#0f9d58')}\u003c/td>\n\u003ctd>${rotScoreCell(x.rot,rotTrail(hist,x.sym,'ro'),'#7c3aed')}\u003c/td>\n\u003ctd class=\"${marketCls(x.rel1)}\">${rotPct(x.rel1)}\u003c/td>\u003ctd class=\"${marketCls(x.rel4)}\">${rotPct(x.rel4)}\u003c/td>\u003ctd class=\"${marketCls(x.rel24)}\">${rotPct(x.rel24)}\u003c/td>\n\u003ctd>${x.wins}/12\u003c/td>\u003ctd>${sh}\u003c/td>\n\u003ctd>\u003cspan class=\"rot-badge ${st.cls}\">${st.txt}\u003c/span>\u003c/td>\u003c/tr>`;\n  }).join('');\n}\n\n/* ---- \ucf54\uc778 \ucd94\uac00 / \uc0ad\uc81c ---- */\nasync function rotLoadUniverse(){\n  if(rotUniverse)return rotUniverse;\n  const rows=await rotUpbit('/v1/market/all?is_details=false',2);\n  const m=new Map();\n  rows.forEach(x=>{if(/^KRW-/.test(x.market))m.set(x.market.slice(4),x.korean_name||x.market.slice(4))});\n  if(!m.size)throw Error('\uc5c5\ube44\ud2b8 \uc6d0\ud654\ub9c8\ucf13 \ubaa9\ub85d\uc774 \ube44\uc5b4 \uc788\uc2b5\ub2c8\ub2e4');\n  rotUniverse=m;\n  const dl=$('rotCoinList');\n  if(dl)dl.innerHTML=[...m].filter(([s])=>s!=='BTC').map(([s,n])=>`\u003coption value=\"${s}\">${n}\u003c/option>`).join('');\n  return m;\n}\nfunction rotMsg(t,bad){const e=$('rotAddMsg');if(!e)return;e.textContent=t||'';e.style.color=bad?'#b42318':'var(--muted)'}\nfunction rotUpdateCount(){\n  const n=ROT_COINS.length;\n  document.querySelectorAll('[data-rot-count]').forEach(e=>e.textContent=n);\n  const c=$('rotCoinCount');if(c)c.textContent=`${n}/${ROT_MAX_COINS}`;\n}\nfunction rotRecompute(){\n  if(!rotRaw)return;\n  const res=rotCompute(rotRaw.btc,rotRaw.data,ROT_COINS);\n  const hist=rotHistLoad();rotHistPush(hist,res.rows);rotHistSave(hist);\n  rotLast=res;rotRender(res,hist);rotSetStatus();\n}\nasync function rotAddCoin(){\n  const inp=$('rotAddInput');if(!inp)return;\n  const sym=inp.value.toUpperCase().replace(/^KRW-/,'').replace(/[^A-Z0-9]/g,'').trim();\n  if(!sym)return rotMsg('\ucd94\uac00\ud560 \ucf54\uc778 \uc2ec\ubcfc\uc744 \uc785\ub825\ud558\uc138\uc694. \uc608: SOL',true);\n  if(sym==='BTC')return rotMsg('BTC\ub294 \ube44\uad50 \uae30\uc900\uc774\ub77c \ubaa9\ub85d\uc5d0 \ub123\uc744 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.',true);\n  if(ROT_COINS.some(x=>x[0]===sym))return rotMsg(sym+'\uc740(\ub294) \uc774\ubbf8 \ubaa9\ub85d\uc5d0 \uc788\uc2b5\ub2c8\ub2e4.',true);\n  if(ROT_COINS.length>=ROT_MAX_COINS)return rotMsg(`\ucd5c\ub300 ${ROT_MAX_COINS}\uac1c\uae4c\uc9c0 \ucd94\uac00\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ud558\ub098\ub97c \uc0ad\uc81c\ud55c \ub4a4 \ucd94\uac00\ud558\uc138\uc694.`,true);\n  if(rotBusy)return rotMsg('\uc218\uc9d1 \uc911\uc785\ub2c8\ub2e4. \uc7a0\uc2dc \ub4a4 \ub2e4\uc2dc \ucd94\uac00\ud5 ==='anchor'):null));\n  // 70\uc810 \uc774\uc0c1 \ud45c\uc2dc \ubc0f \ud604\uc7ac\uc810\n  if(AS.mode==='score'){const bb=AS.data?.score?.bands||{broad:75};months.forEach((m,i)=>{if(asOk(m.s)&&m.s>=bb.broad){x.fillStyle='#d93025';x.beginPath();x.arc(X(i),Y(m.s),2.4,0,7);x.fill()}});}\n  const li=(()=>{for(let i=n-1;i>=0;i--)if(asOk(S.a[i]))return i;return -1})();\n  if(li>=0){x.fillStyle=S.main;x.beginPath();x.arc(X(li),Y(Number(S.a[li])),4,0,7);x.fill()}\n  x.fillStyle='#111827';x.font='bold 11px sans-serif';x.fillText(S.name,pad.l,12);\n  // \ud638\ubc84 \uc2ed\uc790\uc120\n  const hi2=AS.hoverIdx;\n  if(hi2!=null&&hi2>=0&&hi2\u003cn){x.strokeStyle='#64748b';x.lineWidth=1;x.beginPath();x.moveTo(X(hi2),pad.t);x.lineTo(X(hi2),pad.t+ph);x.stroke()}\n  const lg=$('asLegend');\n  if(lg)lg.innerHTML=AS.mode==='score'?`\u003ci style=\"background:#7c3aed\">\u003c/i>SCORE(rolling-60m percentile, ${(months.find(m=>asOk(m.s))||{}).k||'\u2014'}\ubd80\ud130) \u003ci style=\"background:#b6c0cc\">\u003c/i>\uac70\uc2dc \uae30\ubc18 \uc810\uc218(M2\u00b7\ub2ec\ub7ec\u00b7Fed\u00b7BTC, \ub370\uc774\ud130 \ud655\ubcf4 \uad6c\uac04) \u003ci style=\"background:rgba(124,58,237,.25)\">\u003c/i>\uacfc\uac70 \uc54c\ud2b8 \uac15\uc138 \uad6c\uac04 \u00b7 \uc810\uc120 \uad6c\uac04 = BTC.D \uadfc\uc0ac\uac12 \uc0ac\uc6a9`:AS.mode==='dom'?`\uc810\uc120 = \uc6d4\ubcc4 \uc2e4\uce21\uc774 \uc544\ub2cc \uc5f0\ud3c9\uade0 \uc575\ucee4 \ubcf4\uac04(\uadfc\uc0ac)`:'';\n}\nfunction asCaption(i){\n  const d=AS.data,m=d?.history?.months?.[i],cp=$('asCaption');if(!m||!cp)return;\n  const w=(d.history.windows||[]).find(x=>m.k>=x.from&&m.k\u003c=x.to);\n  cp.textContent=`${m.k} \u00b7 SCORE ${asOk(m.s)?m.s:'\u2014'} (\uac70\uc2dc\ub9cc ${asOk(m.mo)?m.mo:'\u2014'}) \u00b7 M2 YoY ${asF(m.m2)} \u00b7 BTC.D ${asOk(m.d)?m.d.toFixed(1)+'%'+(m.ds==='anchor'?'*':''):'\u2014'} \u00b7 ETH/BTC ${asOk(m.e)?Number(m.e).toFixed(4):'\u2014'} \u00b7 BTC 90\uc77c ${asF(m.b,0)}${w?' \u00b7 ['+w.label+']':''}`;\n}\n\n// ===== ALTSEASON STRATEGY RESEARCH LAB =====\n// Monthly, close-to-close backtest. Signals only use the score available at the\n// prior month close; the current incomplete month is excluded.\nconst ASBT={loading:false,prices:null,lastRun:null,sources:{},errors:{}};\nconst ASBT_SYMBOLS=['BTC','ETH','XRP','ADA','SOL','LINK','DOGE','AVAX','NEAR','HBAR','ONDO','UNI','TAO','AAVE'];\nfunction asBtMonth(t){return new Date(Number(t)).toISOString().slice(0,7)}\nfunction asBtNum(v){const n=Number(v);return Number.isFinite(n)?n:null}\nfunction asBtFmt(v,d=2){return Number.isFinite(v)?v.toFixed(d)+'%':'\u2014'}\nfunction asBtStats(rows){\n  let eq=1,peak=1,mdd=0,exposed=0,entries=0,exits=0,prev=false;\n  const curve=[];\n  for(const r of rows){\n    if(r.invested!==prev){eq*=Math.max(0,1-r.cost/100);if(r.invested)entries++;else exits++;prev=r.invested}\n    if(r.invested&&Number.isFinite(r.ret)) {eq*=Math.max(0,1+r.ret/100);exposed++}\n    peak=Math.max(peak,eq);mdd=Math.max(mdd,peak>0?(peak-eq)/peak*100:0);\n    curve.push(eq);\n  }\n  if(prev){eq*=Math.max(0,1-(rows.at(-1)?.cost||0)/100);exits++}\n  return {net:(eq-1)*100,mdd,exposure:rows.length?exposed/rows.length*100:0,entries,exits,months:rows.length,curve};\n}\nfunction asBtReturn(map,from,to){\n  const a=map.get(from),b=map.get(to);\n  return a>0&&b>0?(b/a-1)*100:null;\n}\nfunction asBtMedian(arr){const a=arr.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}\nfunction asBtPrepare(){\n  const months=(AS.data?.history?.months||[]).filter(m=>m&&m.k&&asOk(m.s));\n  const scores=new Map(months.map(m=>[m.k,Number(m.s)]));\n  const allKeys=[...(ASBT.prices?.BTC?.keys?.()||[])].sort();\n  const nowKey=new Date().toISOString().slice(0,7);\n  // Remove the still-open current month to avoid treating a partial candle as final.\n  const keys=allKeys.filter(k=>k\u003cnowKey);\n  return {scores,keys,price:ASBT.prices};\n}\nfunction asBtRunStrategy(keys,scores,prices,opts,from,to,kind){\n  const rows=[];let invested=false;\n  const btc=prices.BTC||new Map();\n  const altSymbols=ASBT_SYMBOLS.filter(s=>s!=='BTC');\n  for(let i=1;i\u003ckeys.length;i++){\n    const prev=keys[i-1],key=keys[i];\n    if(key\u003cfrom||key>to)continue;\n    const score=scores.get(prev);\n    if(!Number.isFinite(score))continue;\n    const btc1=asBtReturn(btc,keys[i-2],prev);\n    const btc3=asBtReturn(btc,keys[i-4],prev);\n    const risk=kind==='guarded'&&((Number.isFinite(btc1)&&btc1\u003c=-12)||(Number.isFinite(btc3)&&btc3\u003c=-25));\n    const available=altSymbols.filter(s=>{const pm=prices[s]||new Map();return Number.isFinite(pm.get(prev))&&pm.get(prev)>0;}); // Eligibility known at prior month close; no future return lookahead\n    if(available.length\u003c2)continue; // avoid reporting fake returns where the historical basket is not observable\n    let selected=available.filter(s=>{\n      const pm=prices[s];\n      if(kind!=='guarded')return true;\n      const r1=asBtReturn(pm,keys[i-2],prev),r3=asBtReturn(pm,keys[i-4],prev);\n      return Number.isFinite(r1)&&Number.isFinite(r3)&&Number.isFinite(btc1)&&Number.isFinite(btc3)&&r1-btc1>=0&&r3-btc3>0;\n    });\n    if(score>=opts.sell||risk||(kind==='guarded'&&invested&&selected.length\u003c2))invested=false;\n    else if(!invested&&score\u003c=opts.buy&&(!risk)&&(kind!=='guarded'||selected.length>=2))invested=true;\n    let ret=null;\n    if(invested){\n      const rs=selected.map(s=>asBtReturn(prices[s],prev,key));\n      // A missing future price cannot be silently dropped: doing so creates survivorship bias.\n      ret=rs.length&&rs.every(Number.isFinite)?rs.reduce((a,b)=>a+b,0)/rs.length:null;\n      if(!Number.isFinite(ret))invested=false;\n    }\n    rows.push({month:key,score,invested,ret,cost:opts.cost,selected:selected.length,risk,btc1,btc3});\n  }\n  return rows;\n}\nfunction asBtPeriodStats(keys,scores,prices,opts,from,to,kind){\n  const rows=asBtRunStrategy(keys,scores,prices,opts,from,to,kind);\n  return {rows,stats:asBtStats(rows)};\n}\nasync function asBtFetchPrices(force=false){\n  if(ASBT.prices&&!force&&Object.values(ASBT.prices).filter(m=>m?.size>0).length===ASBT_SYMBOLS.length)return ASBT.prices;\n  const out={},sources={},errors={};\n  const symbols=ASBT_SYMBOLS;\n  const status=$('asBtStatus');\n  for(let i=0;i\u003csymbols.length;i+=2){\n    const batch=symbols.slice(i,i+2);\n    if(status)status.textContent=`\uc6d4\ubd09 \ub370\uc774\ud130 \uc870\ud68c \uc911\u2026 ${Math.min(i+batch.length,symbols.length)}/${symbols.length}`;\n    const got=await Promise.all(batch.map(async symbol=>{\n      let lastError='';\n      for(let attempt=0;attempt\u003c2;attempt++){\n        try{\n          const d=await call('/candles',{symbol,frame:'month',count:200},18000);\n          if(!d?.ok||!Array.isArray(d.candles)){lastError=d?.error||`HTTP ${d?.status||'\uc624\ub958'}`;continue}\n          const m=new Map();\n          for(const c of d.candles){const k=asBtMonth(c[0]),v=asBtNum(c[4]);if(v>0)m.set(k,v)}\n          if(m.size){sources[symbol]=`${d.source||'unknown'} (${m.size}\uac1c\uc6d4)`;return [symbol,m,'']}\n          lastError='\uc751\ub2f5\uc740 \uc815\uc0c1\uc774\uc9c0\ub9cc \uc720\ud6a8\ud55c \uc6d4\ubd09\uc774 0\uac1c';\n        }catch(e){lastError=String(e?.message||e)}\n        if(attempt===0)await new Promise(r=>setTimeout(r,450));\n      }\n      errors[symbol]=lastError||'\ub370\uc774\ud130 \uc870\ud68c \uc2e4\ud328';\n      return [symbol,new Map(),errors[symbol]];\n    }));\n    for(const [symbol,map] of got)out[symbol]=map;\n  }\n  ASBT.prices=out;ASBT.sources=sources;ASBT.errors=errors;\n  return out;\n}\nfunction asBtRenderRS(keys,prices){\n  const latest=keys.at(-1),previous=keys.at(-2);\n  if(!latest||!previous){$('asBtRS').textContent='\uc0c1\ub300\uac15\ub3c4 \uacc4\uc0b0\uc5d0 \ud544\uc694\ud55c \uc6d4\ubd09 \ub370\uc774\ud130\uac00 \ubd80\uc871\ud569\ub2c8\ub2e4.';return}\n  const btc=prices.BTC||new Map(), function correlations(pairs,days){

  const start=dateAt(date,days);

  for(let i=end;i>0&&pairs[i-1][0]>=start;i--){x.push(pairs[i][1]/pairs[i-1][1]-1);y.push(pairs[i][2]/pairs[i-1][2]-1);}

  x.forEach((v,i)=>{const a=v-mx,b=y[i]-my;xx+=a*a;yy+=b*b;xy+=a*b;});
  return [date,xx&&yy?xy/Math.sqrt(xx*yy):null];

const httpUrl=value=>{const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password)throw Error('인증정보가 없는 HTTPS 주소를 입력하세요.');return u;};
async function loadFeed(url){
 const res=await fetch(httpUrl(url),{signal:AbortSignal.timeout(12000),cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);
 const next=normalize(await res.json());data=next;demo=false;
}

 if(!settings.kr){quote={id,text:'데이터 설정에서 한국주식 Worker 주소를 입력하세요.'};render();return;}
 try{
  const u=new URL('/detail',httpUrl(settings.kr));u.searchParams.set('code',id);
  $('#quote-result').textContent='조회 중…';
  const res=await fetch(u,{signal:AbortSignal.timeout(12000)});const j=await res.json();if(!res.ok||j.ok!==true||!valid(j.quote?.price))throw Error('시세 응답 없음');
  quote={id,text:'₩'+number(j.quote.price,0)+' · '+pct(j.quote.change)+' · PBR '+number(j.metrics?.pbr,2)+' · PER '+number(j.metrics?.per,2)+' · '+(j.quote.updatedAt??'시각 결측')+' · '+(j.source??'한국주식 Worker')};
 }catch(e){quote={id,text:'Worker 조회 실패 · '+e.message};}
 if(view==='cycle'&&assetId===id)render();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.view){location.hash=b.dataset.view;return;}
 if(b.dataset.market){market=b.dataset.market;render();}
 if(b.dataset.pick!==undefined){sector=Number(b.dataset.pick);render();}
 if(b.dataset.stock){assetId=b.dataset.stock;sector=Number(b.dataset.sector);if(view==='cycle')render();else location.hash='cycle';}
 if(b.id==='quote')quoteStock();
 if(b.id==='demo'){data=sample();demo=true;status='합성 데모가 열렸습니다.';render();}
 if(b.id==='sample-file'){const href=URL.createObjectURL(new Blob([JSON.stringify(sample())],{type:'application/json'}));const a=document.createElement('a');a.href=href;a.download='compass-example.json';a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);}
});
document.addEventListener('change',async e=>{
 const el=e.target;
 if(el.dataset.watch){if(el.checked)watched.add(el.dataset.watch);else watched.delete(el.dataset.watch);save('mmc-watch',[...watched]);if(view==='watch')render();return;}
 if(el.id==='snapshot'&&el.files[0]){
  try{data=normalize(JSON.parse(await el.files[0].text()));demo=data.source==='합성 데모';status='JSON 적용 완료 · '+data.asOf;}catch(err){status='읽기 실패 · '+err.message;}
  render();return;
 }
 if(el.id==='period')days=+el.value;
 if(el.id==='sector')sector=+el.value;
 if(el.id==='asset')assetId=el.value;
 if(el.id==='indicator')indicator=el.value;
 if(el.id==='coin'){coin=el.value;indicator='COIN';}
 if(el.id==='chartMode')chartMode=el.value;
 if(['period','sector','asset','indicator','coin','chartMode'].includes(el.id))render();
});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='connect')return;e.preventDefault();
 const form=new FormData(e.target);
 const next={feed:form.get('feed').trim(),kr:form.get('kr').trim()};
 try{
  for(const v of Object.values(next))if(v)httpUrl(v);
  settings=next;save('mmc-settings',settings);
  if(next.feed){$('#connection-status').textContent='스냅샷 조회 중…';await loadFeed(next.feed);demo=data.source==='합성 데모';}
  status=next.feed?'스냅샷 조회 완료 · '+data.asOf:'Worker 주소 설정을 저장했습니다.';
 }catch(err){status='연결 실패 · '+err.message;}
 if(view==='settings')render();
});
function route(){view=location.hash.slice(1)||'overview';render();}
window.addEventListener('hashchange',route);window.addEventListener('resize',()=>lastChart?.());
route();
if(settings.feed)loadFeed(settings.feed).then(()=>{demo=data.source==='합성 데모';render();}).catch(e=>{status='저장된 스냅샷 연결 실패 · '+e.message;});

})();
</script></body></html>
