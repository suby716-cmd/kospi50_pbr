<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSPI 50 종합 투자사이클 대시보드</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-blue: #58a6ff;
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
            --border: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            padding: 15px; 
            line-height: 1.5; 
        }

        /* 헤더 디자인 */
        header { text-align: center; margin-bottom: 20px; padding: 10px 0; }
        header h1 { font-size: 24px; color: var(--accent-blue); margin-bottom: 6px; }
        header p { color: var(--text-sub); font-size: 13px; }

        /* 대시보드 그리드 레이아웃 */
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: 1fr 2fr; 
            gap: 15px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }
        @media (max-width: 992px) { 
            .dashboard-grid { grid-template-columns: 1fr; } 
        }

        /* 카드 컨테이너 */
        .card { 
            background: var(--card-bg); 
            border-radius: 10px; 
            padding: 15px; 
            border: 1px solid var(--border); 
            margin-bottom: 15px; 
        }
        .card-title { 
            font-size: 15px; 
            font-weight: 600; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 8px; 
            color: #f0f6fc;
        }

        /* KCI 스코어 박스 */
        .kci-box { text-align: center; padding: 10px 0; }
        .kci-score { font-size: 38px; font-weight: 800; color: var(--accent-blue); }
        .kci-status { 
            display: inline-block; 
            padding: 5px 14px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 700; 
            background: #238636; 
            color: #ffffff; 
            margin-top: 8px; 
        }

        .widget-container { width: 100%; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>

    <header>
        <h1>📊 코스피 투자사이클 & 글로벌 종합 대시보드</h1>
        <p>거시경제, 실시간 수급 동향, KOSPI 시가총액 상위 종목 통합 모니터링</p>
    </header>

    <div class="dashboard-grid">
        <!-- 좌측 패널: KCI 지수 + 실시간 수급/시세 리스트 -->
        <div class="left-panel">
            
            <!-- 1. 코스피 투자사이클 지수 (KCI) -->
            <div class="card">
                <div class="card-title">
                    <span>💡 코스피 투자사이클 지수 (KCI)</span>
                    <span style="font-size: 11px; color: var(--text-sub);">실시간 분석</span>
                </div>
                <div class="kci-box">
                    <div class="kci-score">68.5 <span style="font-size:18px;">/ 100</span></div>
                    <div class="kci-status">🟢 분할 매수 (Buy)</div>
                </div>
            </div>

            <!-- 2. 시장 종합 수급 & 한국 주요 지수 (트레이딩뷰 라이브 위젯) -->
            <div class="card">
                <div class="card-title">📈 KOSPI / KOSDAQ / 환율 실시간 시세</div>
                <div class="widget-container">
                    <div class="tradingview-widget-container">
                        <div class="tradingview-widget-container__widget"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
                        {
                            "colorTheme": "dark",
                            "dateRange": "1D",
                            "showChart": false,
                            "locale": "kr",
                            "width": "100%",
                            "height": "170",
                            "isTransparent": true,
                            "tabs": [
                                {
                                    "title": "증시 & 환율",
                                    "symbols": [
                                        { "s": "KRX:KOSPI", "d": "코스피" },
                                        { "s": "KRX:KOSDAQ", "d": "코스닥" },
                                        { "s": "FX_IDC:USDKRW", "d": "원/달러 환율" }
                                    ]
                                }
                            ]
                        }
                        </script>
                    </div>
                </div>
            </div>

            <!-- 3. KOSPI 시가총액 상위 종목 실시간 스크리너 -->
            <div class="card">
                <div class="card-title">🇰🇷 KOSPI 주요 대형주 실시간 시세</div>
                <div class="widget-container">
                    <div class="tradingview-widget-container">
                        <div class="tradingview-widget-container__widget"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
                        {
                            "colorTheme": "dark",
                            "dateRange": "12M",
                            "showChart": false,
                            "locale": "kr",
                            "width": "100%",
                            "height": "430",
                            "isTransparent": true,
                            "showSymbolLogo": true,
                            "tabs": [
                                {
                                    "title": "KOSPI 시총 상위",
                                    "symbols": [
                                        { "s": "KRX:005930", "d": "삼성전자" },
                                        { "s": "KRX:000660", "d": "SK하이닉스" },
                                        { "s": "KRX:373220", "d": "LG에너지솔루션" },
                                        { "s": "KRX:207940", "d": "삼성바이오로직스" },
                                        { "s": "KRX:005380", "d": "현대차" },
                                        { "s": "KRX:000270", "d": "기아" },
                                        { "s": "KRX:068270", "d": "셀트리온" },
                                        { "s": "KRX:105560", "d": "KB금융" },
                                        { "s": "KRX:035420", "d": "NAVER" },
                                        { "s": "KRX:055550", "d": "신한지주" },
                                        { "s": "KRX:005490", "d": "POSCO홀딩스" },
                                        { "s": "KRX:012330", "d": "현대모비스" }
                                    ]
                                }
                            ]
                        }
                        </script>
                    </div>
                </div>
            </div>

        </div>

        <!-- 우측 패널: 인터랙티브 실시간 종합 차트 및 매매 신호 분석 -->
        <div class="right-panel">
            
            <!-- 1. 트레이딩뷰 메인 캔들 차트 (KOSPI & 종목 조회 가능) -->
            <div class="card">
                <div class="card-title">📉 KOSPI 실시간 종합 차트 (지표/종목 변경 가능)</div>
                <div id="tv-chart" style="height: 500px; width: 100%;"></div>
            </div>

            <!-- 2. 매매 테크니컬 분석 (실시간 매수/매도 시그널 게이지) -->
            <div class="card">
                <div class="card-title">⚙️ KOSPI 실시간 기술적 분석 시그널</div>
                <div class="widget-container">
                    <div class="tradingview-widget-container">
                        <div class="tradingview-widget-container__widget"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                        {
                            "interval": "1D",
                            "width": "100%",
                            "isTransparent": true,
                            "height": "280",
                            "symbol": "KRX:KOSPI",
                            "showIntervalTabs": true,
                            "displayMode": "single",
                            "locale": "kr",
                            "colorTheme": "dark"
                        }
                        </script>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- TradingView 메인 차트 엔진 스크립트 -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        new TradingView.widget({
            "autosize": true,
            "symbol": "KRX:KOSPI",
            "interval": "D",
            "timezone": "Asia/Seoul",
            "theme": "dark",
            "style": "1",
            "locale": "kr",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tv-chart"
        });
    </script>
</body>
</html>
