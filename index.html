<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코스피 투자사이클 지수 (KCI)</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; max-width: 500px; margin: 40px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .score { font-size: 48px; font-weight: bold; color: #38bdf8; margin: 20px 0; }
        .status { font-size: 20px; font-weight: 600; padding: 10px 20px; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📊 코스피 투자사이클 지수 (KCI)</h2>
        <p>글로벌 거시경제 및 밸류에이션 통합 모니터링</p>
        <div class="score" id="kci-score">계산 중...</div>
        <div class="status" id="kci-status">-</div>
    </div>

    <script>
        // 간단한 시뮬레이션 지수 계산 예시 (웹용)
        async function loadKCI() {
            // 실제 구현시 외부 금융 API를 호출하여 계산
            const score = 65.4; // 임시 계산된 결과 값
            
            document.getElementById('kci-score').innerText = score + " / 100";
            
            const statusEl = document.getElementById('kci-status');
            if (score >= 80) {
                statusEl.innerText = "🔵 강력 매수 (Strong Buy)";
                statusEl.style.background = "#1e3a8a";
            } else if (score >= 60) {
                statusEl.innerText = "🟢 분할 매수 (Buy)";
                statusEl.style.background = "#065f46";
            } else if (score >= 40) {
                statusEl.innerText = "🟡 중립/관망 (Hold)";
                statusEl.style.background = "#854d0e";
            } else {
                statusEl.innerText = "🔴 강력 매도 (Strong Sell)";
                statusEl.style.background = "#991b1b";
            }
        }

        loadKCI();
    </script>
</body>
</html>
